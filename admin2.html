<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعلام الأسعار - سنتر العائلة السعيدة</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #eef2f7 0%, #dbe4f0 100%);
            --card-bg: #ffffff;
            --header-gradient: linear-gradient(135deg, #162447 0%, #1f4068 60%, #1b6ca8 100%);
            --accent-gold: #ffd166;
            --primary-blue: #1b6ca8;
            --success-green: #15803d;
            --success-soft: linear-gradient(135deg, #ecfdf5 0%, #bbf7d0 100%);
            --cart-orange: #ea580c;
            --cart-orange-dark: #c2410c;
            --border-color: #cbd5e1;
            --text-main: #0f172a;
            --danger-bg: #fef2f2;
            --danger-text: #dc2626;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Tahoma, "Segoe UI", sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            margin: 0;
            padding: 18px 14px 32px;
            color: var(--text-main);
        }

        .container {
            max-width: 560px;
            margin: auto;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 16px 38px rgba(22, 36, 71, 0.16);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.85);
        }

        .hero-header {
            background: var(--header-gradient);
            color: #ffffff;
            padding: 24px 20px;
            text-align: center;
        }

        .hero-header h2 {
            margin: 0 0 12px 0;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .store-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, rgba(255, 209, 102, 0.24), rgba(245, 158, 11, 0.18));
            border: 2px solid var(--accent-gold);
            color: #fff3c4;
            font-size: 20px;
            font-weight: bold;
            padding: 9px 22px;
            border-radius: 999px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22);
        }

        .store-icon {
            font-size: 25px;
            line-height: 1;
        }

        .content-body {
            padding: 20px;
        }

        .cart-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%);
            border: 2px solid #fdba74;
            border-radius: 14px;
            padding: 12px 14px;
            margin-bottom: 18px;
        }

        .cart-summary-text {
            font-size: 15px;
            font-weight: bold;
            color: #9a3412;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .cart-count-pill {
            background: var(--cart-orange);
            color: #ffffff;
            font-size: 14px;
            font-weight: bold;
            padding: 2px 10px;
            border-radius: 999px;
        }

        button {
            position: relative;
            z-index: 2;
            touch-action: manipulation;
        }

        .btn-open-cart {
            background: linear-gradient(135deg, var(--cart-orange), #f97316);
            color: #ffffff;
            border: none;
            padding: 10px 14px;
            border-radius: 11px;
            font-size: 14.5px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 0 4px 12px rgba(234, 88, 12, 0.25);
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 7px;
            color: var(--text-main);
            font-size: 15.5px;
        }

        .search-row {
            display: flex;
            gap: 8px;
            align-items: stretch;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            flex: 1;
            min-width: 0;
        }

        input[type="text"] {
            width: 100%;
            padding: 13px 14px 13px 40px;
            font-size: 16px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            background-color: #f8fafc;
            color: var(--text-main);
        }

        input[type="text"]:focus {
            outline: none;
            background-color: #ffffff;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 4px rgba(27, 108, 168, 0.15);
        }

        .clear-btn {
            position: absolute;
            left: 10px;
            background: #e2e8f0;
            color: #475569;
            border: none;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            font-size: 15px;
            line-height: 1;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .btn-cam {
            background: linear-gradient(135deg, #1b6ca8, #0ea5e9);
            color: #ffffff;
            border: none;
            padding: 0 14px;
            font-size: 14.5px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            white-space: nowrap;
            box-shadow: 0 4px 12px rgba(27, 108, 168, 0.25);
        }

        .btn-search-inline {
            background: linear-gradient(135deg, #16a34a, #22c55e);
            color: #ffffff;
            border: none;
            padding: 0 15px;
            font-size: 14.5px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            white-space: nowrap;
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.25);
        }

        #cameraBox {
            width: 100%;
            max-width: 420px;
            margin: 14px auto;
            border-radius: 12px;
            overflow: hidden;
            display: none;
            border: 2px solid var(--primary-blue);
            background: #000000;
            text-align: center;
        }

        #cameraVideo {
            width: 100%;
            max-height: 240px;
            display: block;
            object-fit: cover;
        }

        .status-msg {
            margin-top: 18px;
            padding: 14px 16px;
            border-radius: 12px;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
        }

        .status-loading {
            background: #eff6ff;
            color: var(--primary-blue);
            border: 1px solid #bfdbfe;
        }

        .status-error {
            background: var(--danger-bg);
            color: var(--danger-text);
            border: 1px solid #fecaca;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.68);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 9999;
        }

        .modal-overlay.active {
            display: flex;
        }

        #barcodeModal {
            z-index: 10000;
        }

        .modal-box {
            width: 100%;
            max-width: 520px;
            max-height: 92vh;
            overflow-y: auto;
            background: #ffffff;
            border-radius: 22px;
            box-shadow: 0 24px 55px rgba(15, 23, 42, 0.35);
            border: 2px solid #e2e8f0;
            overflow-x: hidden;
        }

        .modal-top-bar {
            background: var(--header-gradient);
            color: #ffffff;
            padding: 16px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .modal-store-title {
            font-size: 19px;
            font-weight: bold;
            color: #fff3c4;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal-close-icon {
            background: rgba(255, 255, 255, 0.16);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-body {
            padding: 18px;
        }

        .modal-result-card {
            background: linear-gradient(180deg, #f8fafc 0%, #ffffff 100%);
            border: 2px solid #cbd5e1;
            border-top: 6px solid var(--primary-blue);
            border-radius: 18px;
            padding: 18px 16px;
            margin-bottom: 14px;
            box-shadow: 0 8px 22px rgba(15, 23, 42, 0.08);
            text-align: center;
        }

        .modal-result-card:last-child {
            margin-bottom: 0;
        }

        .modal-item-name {
            font-size: 22px;
            font-weight: bold;
            color: #0f172a;
            line-height: 1.5;
            margin-bottom: 14px;
            padding-bottom: 12px;
            border-bottom: 2px dashed #cbd5e1;
        }

        .modal-price-panel {
            background: var(--success-soft);
            border: 2px solid #4ade80;
            border-radius: 15px;
            padding: 14px;
            margin-bottom: 14px;
        }

        .modal-price-caption {
            font-size: 16px;
            font-weight: bold;
            color: #14532d;
            margin-bottom: 4px;
        }

        .modal-price-value {
            font-size: 32px;
            font-weight: bold;
            color: #15803d;
            line-height: 1.15;
        }

        .btn-add-cart {
            width: 100%;
            background: linear-gradient(135deg, var(--cart-orange), #f97316);
            color: #ffffff;
            border: none;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .cart-item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 13px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .cart-item-info {
            flex: 1;
            min-width: 0;
        }

        .cart-item-title {
            font-size: 15.5px;
            font-weight: bold;
            color: #0f172a;
            margin-bottom: 4px;
        }

        .cart-item-sub {
            font-size: 13.5px;
            color: #15803d;
            font-weight: bold;
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .qty-btn {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            background: #ffffff;
            color: #0f172a;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .qty-num {
            min-width: 24px;
            text-align: center;
            font-weight: bold;
            font-size: 15.5px;
        }

        .btn-remove-item {
            background: #fee2e2;
            color: #dc2626;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .cart-total-box {
            background: var(--success-soft);
            border: 2px solid #86efac;
            border-radius: 14px;
            padding: 12px 14px;
            margin: 14px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 17px;
            font-weight: bold;
            color: #14532d;
        }

        .cart-actions-grid {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .btn-generate-code {
            flex: 2;
            background: linear-gradient(135deg, #16a34a, #22c55e);
            color: #ffffff;
            border: none;
            padding: 13px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-clear-cart {
            flex: 1;
            background: #fef2f2;
            color: #dc2626;
            border: 1.5px solid #fecaca;
            padding: 13px 10px;
            border-radius: 12px;
            font-size: 14.5px;
            font-weight: bold;
            cursor: pointer;
        }

        .barcode-popup-wrap {
            background: #ffffff;
            border: 2px solid #cbd5e1;
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            overflow: hidden;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #qrCanvas {
            width: 100%;
            max-width: 280px;
            height: auto;
            aspect-ratio: 1 / 1;
            display: block;
            margin: 0 auto;
        }

        .invoice-amount-compact {
            background: var(--success-soft);
            border: 1.5px solid #4ade80;
            border-radius: 12px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .invoice-amount-label {
            font-size: 14px;
            font-weight: bold;
            color: #14532d;
        }

        .invoice-amount-value {
            font-size: 20px;
            font-weight: bold;
            color: #15803d;
            line-height: 1.1;
        }

        .modal-footer-actions {
            padding: 0 18px 18px 18px;
        }

        .btn-modal-close {
            width: 100%;
            background: linear-gradient(135deg, #162447, #1b6ca8);
            color: #ffffff;
            border: none;
            padding: 13px;
            font-size: 17px;
            font-weight: bold;
            border-radius: 13px;
            cursor: pointer;
        }

        @media (max-width: 480px) {
            .search-row {
                flex-wrap: wrap;
            }
            .input-wrapper {
                flex-basis: 100%;
            }
            .btn-cam,
            .btn-search-inline {
                flex: 1;
                padding: 11px 12px;
                font-size: 15px;
            }
            .modal-item-name {
                font-size: 20px;
            }
            .modal-price-value {
                font-size: 29px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="hero-header">
        <h2>🔍 استعلام الأسعار السريع</h2>
        <div class="store-badge">
            <span class="store-icon">🏪</span>
            <span>معرض سنتر العائلة</span>
        </div>
    </div>

    <div class="content-body">
        <div class="cart-bar">
            <div class="cart-summary-text">
                <span>🛒 سلة التسوق:</span>
                <span id="cartBadgeCount" class="cart-count-pill">0 صنف</span>
                <span id="cartBadgeTotal" style="font-size: 14px; color: #15803d;">(0 د.ل)</span>
            </div>
            <button type="button" id="openCartBtn" class="btn-open-cart">عرض السلة والباركود</button>
        </div>

        <div class="form-group">
            <label for="nameOrIdInput">1. البحث باسم المادة أو رقم الصنف</label>
            <div class="search-row">
                <div class="input-wrapper">
                    <input type="text" id="nameOrIdInput" placeholder="اكتب اسم المادة أو رقم الصنف...">
                    <button type="button" id="clearNameBtn" class="clear-btn" title="مسح">×</button>
                </div>
                <button type="button" id="searchNameBtn" class="btn-search-inline">بحث فوراً 🔍</button>
            </div>
        </div>

        <div class="form-group">
            <label for="barcodeInput">2. البحث بالباركود أو الكاميرا</label>
            <div class="search-row">
                <div class="input-wrapper">
                    <input type="text" id="barcodeInput" placeholder="اكتب الباركود أو امسحه بالكاميرا...">
                    <button type="button" id="clearBarcodeBtn" class="clear-btn" title="مسح">×</button>
                </div>
                <button type="button" id="cameraBtn" class="btn-cam">📷 كاميرا</button>
                <button type="button" id="searchBarcodeBtn" class="btn-search-inline">بحث فوراً 🔍</button>
            </div>
        </div>

        <div id="cameraBox">
            <video id="cameraVideo" autoplay playsinline muted></video>
        </div>

        <div id="results"></div>
    </div>
</div>

<!-- النافذة المنبثقة لعرض الصنف والسعر -->
<div id="resultModal" class="modal-overlay" role="dialog" aria-modal="true">
    <div class="modal-box" id="resultModalBox">
        <div class="modal-top-bar">
            <div class="modal-store-title">
                <span>🏪</span>
                <span>سنتر العائلة السعيدة</span>
            </div>
            <button type="button" id="closeResultTopBtn" class="modal-close-icon" title="إغلاق">×</button>
        </div>
        <div id="modalBody" class="modal-body"></div>
        <div class="modal-footer-actions">
            <button type="button" id="closeResultBottomBtn" class="btn-modal-close">إغلاق النافذة</button>
        </div>
    </div>
</div>

<!-- النافذة المنبثقة لسلة التسوق -->
<div id="cartModal" class="modal-overlay" role="dialog" aria-modal="true">
    <div class="modal-box" id="cartModalBox">
        <div class="modal-top-bar">
            <div class="modal-store-title">
                <span>🛒</span>
                <span>سلة التسوق - سنتر العائلة السعيدة</span>
            </div>
            <button type="button" id="closeCartTopBtn" class="modal-close-icon" title="إغلاق">×</button>
        </div>
        <div class="modal-body">
            <div id="cartItemsList"></div>
            <div class="cart-total-box">
                <span>الإجمالي التقريبي:</span>
                <span id="cartModalTotal">0 د.ل</span>
            </div>
            <div class="cart-actions-grid">
                <button type="button" id="generateCartBarcodeBtn" class="btn-generate-code">توليد باركود الكاشير 🧾</button>
                <button type="button" id="clearCartBtn" class="btn-clear-cart">تفريغ</button>
            </div>
        </div>
        <div class="modal-footer-actions">
            <button type="button" id="closeCartBottomBtn" class="btn-modal-close">إغلاق السلة</button>
        </div>
    </div>
</div>

<!-- النافذة المنبثقة لـ QR كود وقيمة الفاتورة -->
<div id="barcodeModal" class="modal-overlay" role="dialog" aria-modal="true">
    <div class="modal-box" id="barcodeModalBox">
        <div class="modal-top-bar">
            <div class="modal-store-title">
                <span>🧾</span>
                <span>باركود الفاتورة (QR)</span>
            </div>
            <button type="button" id="closeBarcodeTopBtn" class="modal-close-icon" title="إغلاق">×</button>
        </div>
        <div class="modal-body">
            <div class="barcode-popup-wrap">
                <canvas id="qrCanvas" width="320" height="320"></canvas>
            </div>
            <div class="invoice-amount-compact">
                <span class="invoice-amount-label">قيمة الفاتورة</span>
                <span id="barcodePopupTotal" class="invoice-amount-value">0 د.ل</span>
            </div>
        </div>
        <div class="modal-footer-actions">
            <button type="button" id="closeBarcodeBottomBtn" class="btn-modal-close">إغلاق</button>
        </div>
    </div>
</div>
