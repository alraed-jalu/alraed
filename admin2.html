<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعلام الأسعار - سنتر العائلة السعيدة</title>
    <!-- مكتبة قراءة الباركود بالكاميرا -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- مكتبة توليد الباركود الخطي (CODE128) -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #eef2f7 0%, #dbe4f0 100%);
            --card-bg: #ffffff;
            --header-gradient: linear-gradient(135deg, #162447 0%, #1f4068 60%, #1b6ca8 100%);
            --accent-gold: #ffd166;
            --primary-blue: #1b6ca8;
            --primary-blue-hover: #145382;
            --success-green: #15803d;
            --success-bright: #16a34a;
            --success-soft: linear-gradient(135deg, #ecfdf5 0%, #bbf7d0 100%);
            --cart-orange: #ea580c;
            --cart-orange-dark: #c2410c;
            --border-color: #cbd5e1;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --danger-bg: #fef2f2;
            --danger-text: #dc2626;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Tahoma, "Segoe UI", sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            margin: 0;
            padding: 18px 14px 32px;
            color: var(--text-main);
        }

        .container {
            max-width: 560px;
            margin: auto;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 16px 38px rgba(22, 36, 71, 0.16);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.85);
        }

        .hero-header {
            background: var(--header-gradient);
            color: #ffffff;
            padding: 24px 20px;
            text-align: center;
            position: relative;
        }

        .hero-header h2 {
            margin: 0 0 12px 0;
            font-size: 22px;
            letter-spacing: 0.2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .store-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, rgba(255, 209, 102, 0.24), rgba(245, 158, 11, 0.18));
            border: 2px solid var(--accent-gold);
            color: #fff3c4;
            font-size: 20px;
            font-weight: bold;
            padding: 9px 22px;
            border-radius: 999px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22);
        }

        .store-icon {
            font-size: 25px;
            line-height: 1;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.25));
        }

        .content-body {
            padding: 20px;
        }

        .cart-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%);
            border: 2px solid #fdba74;
            border-radius: 14px;
            padding: 12px 14px;
            margin-bottom: 18px;
        }

        .cart-summary-text {
            font-size: 15px;
            font-weight: bold;
            color: #9a3412;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .cart-count-pill {
            background: var(--cart-orange);
            color: #ffffff;
            font-size: 14px;
            font-weight: bold;
            padding: 2px 10px;
            border-radius: 999px;
        }

        .btn-open-cart {
            background: linear-gradient(135deg, var(--cart-orange), #f97316);
            color: #ffffff;
            border: none;
            padding: 10px 14px;
            border-radius: 11px;
            font-size: 14.5px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 0 4px 12px rgba(234, 88, 12, 0.25);
            transition: all 0.2s ease;
        }

        .btn-open-cart:hover {
            background: linear-gradient(135deg, var(--cart-orange-dark), var(--cart-orange));
            transform: translateY(-1px);
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 7px;
            color: var(--text-main);
            font-size: 15.5px;
        }

        .search-row {
            display: flex;
            gap: 8px;
            align-items: stretch;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            flex: 1;
            min-width: 0;
        }

        input[type="text"] {
            width: 100%;
            padding: 13px 14px 13px 40px;
            font-size: 16px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            background-color: #f8fafc;
            color: var(--text-main);
            transition: all 0.22s ease;
        }

        input[type="text"]:focus {
            outline: none;
            background-color: #ffffff;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 4px rgba(27, 108, 168, 0.15);
            transform: translateY(-1px);
        }

        .clear-btn {
            position: absolute;
            left: 10px;
            background: #e2e8f0;
            color: #475569;
            border: none;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            font-size: 15px;
            line-height: 1;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            transition: all 0.18s ease;
        }

        .clear-btn:hover {
            background: #cbd5e1;
            color: #0f172a;
        }

        .btn-cam {
            background: linear-gradient(135deg, #1b6ca8, #0ea5e9);
            color: #ffffff;
            border: none;
            padding: 0 14px;
            font-size: 14.5px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            white-space: nowrap;
            box-shadow: 0 4px 12px rgba(27, 108, 168, 0.25);
            transition: all 0.2s ease;
        }

        .btn-cam:hover {
            background: linear-gradient(135deg, #145382, #0284c7);
            transform: translateY(-1px);
        }

        .btn-search-inline {
            background: linear-gradient(135deg, #16a34a, #22c55e);
            color: #ffffff;
            border: none;
            padding: 0 15px;
            font-size: 14.5px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            white-space: nowrap;
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.25);
            transition: all 0.2s ease;
        }

        .btn-search-inline:hover {
            background: linear-gradient(135deg, #15803d, #16a34a);
            transform: translateY(-1px);
        }

        #reader {
            width: 100%;
            max-width: 420px;
            margin: 14px auto;
            border-radius: 12px;
            overflow: hidden;
            display: none;
            border: 2px solid var(--primary-blue);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
        }

        .status-msg {
            margin-top: 18px;
            padding: 14px 16px;
            border-radius: 12px;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            animation: modalPop 0.22s ease-out;
        }

        .status-loading {
            background: #eff6ff;
            color: var(--primary-blue);
            border: 1px solid #bfdbfe;
        }

        .status-error {
            background: var(--danger-bg);
            color: var(--danger-text);
            border: 1px solid #fecaca;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 9999;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            width: 100%;
            max-width: 520px;
            max-height: 90vh;
            overflow-y: auto;
            background: #ffffff;
            border-radius: 22px;
            box-shadow: 0 24px 55px rgba(15, 23, 42, 0.35);
            border: 2px solid #e2e8f0;
            animation: modalPop 0.24s cubic-bezier(0.16, 1, 0.3, 1);
            overflow-x: hidden;
        }

        @keyframes modalPop {
            from {
                opacity: 0;
                transform: scale(0.92) translateY(10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal-top-bar {
            background: var(--header-gradient);
            color: #ffffff;
            padding: 16px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .modal-store-title {
            font-size: 19px;
            font-weight: bold;
            color: #fff3c4;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal-close-icon {
            background: rgba(255, 255, 255, 0.16);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.18s ease;
        }

        .modal-close-icon:hover {
            background: rgba(239, 68, 68, 0.85);
            border-color: transparent;
        }

        .modal-body {
            padding: 18px;
        }

        .modal-result-card {
            background: linear-gradient(180deg, #f8fafc 0%, #ffffff 100%);
            border: 2px solid #cbd5e1;
            border-top: 6px solid var(--primary-blue);
            border-radius: 18px;
            padding: 18px 16px;
            margin-bottom: 14px;
            box-shadow: 0 8px 22px rgba(15, 23, 42, 0.08);
            text-align: center;
        }

        .modal-result-card:last-child {
            margin-bottom: 0;
        }

        .modal-item-name {
            font-size: 22px;
            font-weight: bold;
            color: #0f172a;
            line-height: 1.5;
            margin-bottom: 14px;
            padding-bottom: 12px;
            border-bottom: 2px dashed #cbd5e1;
        }

        .modal-price-panel {
            background: var(--success-soft);
            border: 2px solid #4ade80;
            border-radius: 15px;
            padding: 14px;
            margin-bottom: 14px;
            box-shadow: 0 6px 16px rgba(22, 163, 74, 0.14);
        }

        .modal-price-caption {
            font-size: 16px;
            font-weight: bold;
            color: #14532d;
            margin-bottom: 4px;
        }

        .modal-price-value {
            font-size: 32px;
            font-weight: bold;
            color: #15803d;
            line-height: 1.15;
        }

        .btn-add-cart {
            width: 100%;
            background: linear-gradient(135deg, var(--cart-orange), #f97316);
            color: #ffffff;
            border: none;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 14px rgba(234, 88, 12, 0.25);
            transition: all 0.2s ease;
        }

        .btn-add-cart:hover {
            background: linear-gradient(135deg, var(--cart-orange-dark), var(--cart-orange));
            transform: translateY(-1px);
        }

        .cart-item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 13px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .cart-item-info {
            flex: 1;
            min-width: 0;
        }

        .cart-item-title {
            font-size: 15.5px;
            font-weight: bold;
            color: #0f172a;
            margin-bottom: 4px;
        }

        .cart-item-sub {
            font-size: 13.5px;
            color: #15803d;
            font-weight: bold;
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .qty-btn {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            background: #ffffff;
            color: #0f172a;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .qty-btn:hover {
            background: #e2e8f0;
        }

        .qty-num {
            min-width: 24px;
            text-align: center;
            font-weight: bold;
            font-size: 15.5px;
        }

        .btn-remove-item {
            background: #fee2e2;
            color: #dc2626;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .cart-total-box {
            background: var(--success-soft);
            border: 2px solid #86efac;
            border-radius: 14px;
            padding: 12px 14px;
            margin: 14px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 17px;
            font-weight: bold;
            color: #14532d;
        }

        .cart-actions-grid {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .btn-generate-code {
            flex: 2;
            background: linear-gradient(135deg, #16a34a, #22c55e);
            color: #ffffff;
            border: none;
            padding: 13px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(22, 163, 74, 0.25);
        }

        .btn-clear-cart {
            flex: 1;
            background: #fef2f2;
            color: #dc2626;
            border: 1.5px solid #fecaca;
            padding: 13px 10px;
            border-radius: 12px;
            font-size: 14.5px;
            font-weight: bold;
            cursor: pointer;
        }

        .barcode-output-box {
            margin-top: 16px;
            background: #ffffff;
            border: 2px solid #1b6ca8;
            border-radius: 16px;
            padding: 16px 12px;
            text-align: center;
        }

        .barcode-output-title {
            font-size: 16px;
            font-weight: bold;
            color: #162447;
            margin-bottom: 12px;
        }

        .barcode-canvas-wrap {
            background: #ffffff;
            padding: 12px 8px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            overflow-x: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
        }

        #linearBarcodeSvg {
            max-width: 100%;
            height: auto;
            display: block;
        }

        .code-payload-text {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 10px;
            font-family: monospace;
            font-size: 14px;
            font-weight: bold;
            color: #0f172a;
            word-break: break-all;
            direction: ltr;
            text-align: center;
        }

        .modal-footer-actions {
            padding: 0 18px 18px 18px;
        }

        .btn-modal-close {
            width: 100%;
            background: linear-gradient(135deg, #162447, #1b6ca8);
            color: #ffffff;
            border: none;
            padding: 13px;
            font-size: 17px;
            font-weight: bold;
            border-radius: 13px;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(22, 36, 71, 0.24);
        }

        @media (max-width: 480px) {
            .search-row {
                flex-wrap: wrap;
            }
            .input-wrapper {
                flex-basis: 100%;
            }
            .btn-cam,
            .btn-search-inline {
                flex: 1;
                padding: 11px 12px;
                font-size: 15px;
            }
            .modal-item-name {
                font-size: 20px;
            }
            .modal-price-value {
                font-size: 29px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="hero-header">
        <h2>🔍 استعلام الأسعار السريع</h2>
        <div class="store-badge">
            <span class="store-icon">🏪</span>
            <span>معرض سنتر العائلة</span>
        </div>
    </div>

    <div class="content-body">
        <!-- خانة وزر سلة التسوق للزبائن -->
        <div class="cart-bar">
            <div class="cart-summary-text">
                <span>🛒 سلة التسوق:</span>
                <span id="cartBadgeCount" class="cart-count-pill">0 صنف</span>
                <span id="cartBadgeTotal" style="font-size: 14px; color: #15803d;">(0 د.ل)</span>
            </div>
            <button type="button" id="openCartBtn" class="btn-open-cart">عرض السلة والباركود</button>
        </div>

        <!-- المربع الأول: البحث باسم المادة أو رقم الصنف + زر البحث بجانبه -->
        <div class="form-group">
            <label for="nameOrIdInput">1. البحث باسم المادة أو رقم الصنف</label>
            <div class="search-row">
                <div class="input-wrapper">
                    <input type="text" id="nameOrIdInput" placeholder="اكتب اسم المادة أو رقم الصنف...">
                    <button type="button" id="clearNameBtn" class="clear-btn" title="مسح">×</button>
                </div>
                <button type="button" id="searchNameBtn" class="btn-search-inline">بحث فوراً 🔍</button>
            </div>
        </div>

        <!-- المربع الثاني: كتابة الباركود أو قراءته بالكاميرا + زر الكاميرا وزر البحث بجانبه -->
        <div class="form-group">
            <label for="barcodeInput">2. البحث بالباركود أو الكاميرا</label>
            <div class="search-row">
                <div class="input-wrapper">
                    <input type="text" id="barcodeInput" placeholder="اكتب الباركود أو امسحه بالكاميرا...">
                    <button type="button" id="clearBarcodeBtn" class="clear-btn" title="مسح">×</button>
                </div>
                <button type="button" id="cameraBtn" class="btn-cam">📷 كاميرا</button>
                <button type="button" id="searchBarcodeBtn" class="btn-search-inline">بحث فوراً 🔍</button>
            </div>
        </div>

        <div id="reader"></div>

        <div id="results"></div>
    </div>
</div>

<!-- النافذة المنبثقة لعرض الصنف والسعر وإضافته للسلة -->
<div id="resultModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modalStoreTitle">
    <div class="modal-box" id="resultModalBox">
        <div class="modal-top-bar">
            <div id="modalStoreTitle" class="modal-store-title">
                <span>🏪</span>
                <span>سنتر العائلة السعيدة</span>
            </div>
            <button type="button" id="closeModalTopBtn" class="modal-close-icon" title="إغلاق">×</button>
        </div>
        <div id="modalBody" class="modal-body"></div>
        <div class="modal-footer-actions">
            <button type="button" id="closeModalBottomBtn" class="btn-modal-close">إغلاق النافذة</button>
        </div>
    </div>
</div>

<!-- النافذة المنبثقة لسلة التسوق وتوليد باركود الكاشير -->
<div id="cartModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="cartModalTitle">
    <div class="modal-box" id="cartModalBox">
        <div class="modal-top-bar">
            <div id="cartModalTitle" class="modal-store-title">
                <span>🛒</span>
                <span>سلة التسوق - سنتر العائلة السعيدة</span>
            </div>
            <button type="button" id="closeCartTopBtn" class="modal-close-icon" title="إغلاق">×</button>
        </div>
        <div class="modal-body">
            <div id="cartItemsList"></div>
            <div class="cart-total-box">
                <span>الإجمالي التقريبي:</span>
                <span id="cartModalTotal">0 د.ل</span>
            </div>
            <div class="cart-actions-grid">
                <button type="button" id="generateCartBarcodeBtn" class="btn-generate-code">توليد باركود الكاشير 🧾</button>
                <button type="button" id="clearCartBtn" class="btn-clear-cart">تفريغ</button>
            </div>
            <div id="generatedBarcodeSection" class="barcode-output-box" style="display: none;">
                <div class="barcode-output-title">امسح الباركود الخطي (CODE128) من جهاز موظف الكاشير</div>
                <div class="barcode-canvas-wrap">
                    <svg id="linearBarcodeSvg"></svg>
                </div>
                <div id="codePayloadText" class="code-payload-text"></div>
            </div>
        </div>
        <div class="modal-footer-actions">
            <button type="button" id="closeCartBottomBtn" class="btn-modal-close">إغلاق السلة</button>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://romlgjbchyrwlwpcgffi.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJvbWxnamJjaHlyd2x3cGNnZmZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2MDMxNDUsImV4cCI6MjEwMjE3OTE0NX0.wg90ZMVaVMV1UAriGXNEhYqnWlCDzqFjZY87UqSTxbw";
    const FIXED_STORE_ID = "2";

    let html5QrCode = null;
    let cameraIsRunning = false;
    let lastSearchItems = [];
    let shoppingCart = [];

    function escapeHtml(text) {
        const raw = (text === undefined || text === null) ? "" : String(text);
        return raw
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
    }

    function getItemKey(item, index) {
        const idx = index || 0;
        if (item.barcode && String(item.barcode).trim() !== "") return String(item.barcode).trim();
        if (item.item_id !== undefined && item.item_id !== null && String(item.item_id).trim() !== "") return String(item.item_id).trim();
        return "item_" + idx;
    }

    function addItemToCartByIndex(index) {
        const item = lastSearchItems[index];
        if (!item) return;

        const key = getItemKey(item, index);
        const priceNum = Number(item.sale_price) || 0;
        const existing = shoppingCart.find(function (entry) { return entry.key === key; });

        if (existing) {
            existing.qty += 1;
        } else {
            shoppingCart.push({
