<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعلام الأسعار - سنتر العائلة السعيدة</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Tahoma, Arial, sans-serif;
            background: #e8eef5;
            margin: 0;
            padding: 16px;
            color: #0f172a;
        }
        .box {
            max-width: 540px;
            margin: auto;
            background: #ffffff;
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        }
        .header {
            background: #162447;
            color: #ffffff;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 16px;
        }
        .header h2 {
            margin: 0 0 8px 0;
            font-size: 20px;
        }
        .store-tag {
            display: inline-block;
            background: #ffd166;
            color: #162447;
            font-weight: bold;
            padding: 6px 16px;
            border-radius: 999px;
            font-size: 16px;
        }
        .cart-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            background: #fff7ed;
            border: 1px solid #fdba74;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 16px;
            font-weight: bold;
        }
        .field-group {
            margin-bottom: 14px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }
        .row {
            display: flex;
            gap: 8px;
        }
        input[type="text"] {
            flex: 1;
            min-width: 0;
            padding: 11px 12px;
            font-size: 15px;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
        }
        button {
            cursor: pointer;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            padding: 11px 14px;
        }
        .btn-blue { background: #1b6ca8; color: #fff; }
        .btn-green { background: #15803d; color: #fff; }
        .btn-orange { background: #ea580c; color: #fff; }
        .btn-dark { background: #162447; color: #fff; width: 100%; }
        .btn-red { background: #dc2626; color: #fff; }

        #msg {
            margin-top: 12px;
            padding: 12px;
            border-radius: 10px;
            display: none;
            font-weight: bold;
            text-align: center;
        }
        .msg-info { background: #eff6ff; color: #1d4ed8; display: block !important; }
        .msg-err { background: #fef2f2; color: #b91c1c; display: block !important; }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            z-index: 999;
            padding: 16px;
            align-items: center;
            justify-content: center;
        }
        .modal.show { display: flex; }
        .modal-card {
            background: #fff;
            width: 100%;
            max-width: 480px;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 16px;
            padding: 16px;
        }
        .modal-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 10px;
            margin-bottom: 14px;
            font-weight: bold;
            font-size: 17px;
        }
        .item-card {
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            text-align: center;
            background: #f8fafc;
        }
        .item-name {
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .item-price {
            font-size: 26px;
            font-weight: bold;
            color: #15803d;
            background: #dcfce7;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 12px;
        }
        .cart-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 8px;
            background: #f8fafc;
        }
        .cart-total {
            display: flex;
            justify-content: space-between;
            font-size: 17px;
            font-weight: bold;
            color: #14532d;
            background: #dcfce7;
            padding: 10px 12px;
            border-radius: 10px;
            margin: 12px 0;
        }
        .qr-box {
            text-align: center;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            background: #fff;
            margin-bottom: 10px;
        }
        #qrCanvas {
            width: 240px;
            height: 240px;
            max-width: 100%;
            display: block;
            margin: auto;
        }
        .invoice-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #dcfce7;
            color: #14532d;
            padding: 8px 12px;
            border-radius: 10px;
            font-weight: bold;
            margin-bottom: 12px;
        }
        .invoice-val {
            font-size: 20px;
            color: #15803d;
        }
    </style>
</head>
<body>

<div class="box">
    <div class="header">
        <h2>🔍 استعلام الأسعار السريع</h2>
        <div class="store-tag">🏪 معرض سنتر العائلة</div>
    </div>

    <div class="cart-bar">
        <div>
            🛒 السلة: <span id="badgeCount">0</span> صنف — <span id="badgeTotal">0</span> د.ل
        </div>
        <button type="button" class="btn-orange" id="btnOpenCart">عرض السلة</button>
    </div>

    <div class="field-group">
        <label for="inName">1. البحث بالاسم أو رقم الصنف</label>
        <div class="row">
            <input type="text" id="inName" placeholder="اكتب اسم المادة أو رقم الصنف...">
            <button type="button" class="btn-green" id="btnSearchName">بحث 🔍</button>
        </div>
    </div>

    <div class="field-group">
        <label for="inBarcode">2. البحث بالباركود</label>
        <div class="row">
            <input type="text" id="inBarcode" placeholder="اكتب أو امسح الباركود...">
            <button type="button" class="btn-blue" id="btnSearchBarcode">بحث 🔍</button>
        </div>
    </div>

    <div id="msg"></div>
</div>

<!-- نافذة النتائج -->
<div class="modal" id="modalResult">
    <div class="modal-card">
        <div class="modal-head">
            <span>نتيجة البحث - سنتر العائلة السعيدة</span>
            <button type="button" class="btn-red" id="btnCloseResultX">×</button>
        </div>
        <div id="resultList"></div>
        <button type="button" class="btn-dark" id="btnCloseResult">إغلاق</button>
    </div>
</div>

<!-- نافذة السلة -->
<div class="modal" id="modalCart">
    <div class="modal-card">
        <div class="modal-head">
            <span>🛒 سلة التسوق</span>
            <button type="button" class="btn-red" id="btnCloseCartX">×</button>
        </div>
        <div id="cartList"></div>
        <div class="cart-total">
            <span>الإجمالي:</span>
            <span><span id="cartSum">0</span> د.ل</span>
        </div>
        <div class="row" style="margin-bottom:10px;">
            <button type="button" class="btn-green" style="flex:2;" id="btnMakeQr">توليد QR الفاتورة</button>
            <button type="button" class="btn-red" style="flex:1;" id="btnEmptyCart">تفريغ</button>
        </div>
        <button type="button" class="btn-dark" id="btnCloseCart">إغلاق</button>
    </div>
</div>

<!-- نافذة QR الفاتورة -->
<div class="modal" id="modalQr">
    <div class="modal-card">
        <div class="modal-head">
            <span>QR الفاتورة</span>
            <button type="button" class="btn-red" id="btnCloseQrX">×</button>
        </div>
        <div class="qr-box">
            <canvas id="qrCanvas" width="240" height="240"></canvas>
        </div>
        <div class="invoice-box">
            <span>قيمة الفاتورة</span>
            <span class="invoice-val"><span id="qrInvoiceSum">0</span> د.ل</span>
        </div>
        <button type="button" class="btn-dark" id="btnCloseQr">إغلاق</button>
    </div>
</div>

<script>
(function () {
    var SB_URL = "https://romlgjbchyrwlwpcgffi.supabase.co";
    var SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJvbWxnamJjaHlyd2x3cGNnZmZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2MDMxNDUsImV4cCI6MjEwMjE3OTE0NX0.wg90ZMVaVMV1UAriGXNEhYqnWlCDzqFjZY87UqSTxbw";
    var STORE_ID = "2";

    var foundItems = [];
    var cart = [];

    function showMsg(text, isError) {
        var el = document.getElementById("msg");
        if (!el) return;
        el.textContent = text;
        el.className = isError ? "msg-err" : "msg-info";
    }

    function hideMsg() {
        var el = document.getElementById("msg");
        if (!el) return;
        el.textContent = "";
        el.className = "";
    }

    function esc(s) {
        return String(s == null ? "" : s)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
    }

    function calcTotal() {
        var sum = 0;
        for (var i = 0; i < cart.length; i++) {
            sum += (Number(cart[i].price) || 0) * (Number(cart[i].qty) || 1);
        }
        return sum;
    }

    function refreshCartBadge() {
        var count = 0;
        for (var i = 0; i < cart.length; i++) {
            count += Number(cart[i].qty) || 1;
        }
        var bCount = document.getElementById("badgeCount");
        var bTotal = document.getElementById("badgeTotal");
        if (bCount) bCount.textContent = String(count);
        if (bTotal) bTotal.textContent = String(calcTotal());
    }

    function openModal(id) {
        var m = document.getElementById(id);
        if (m) m.classList.add("show");
    }

    function closeModal(id) {
        var m = document.getElementById(id);
        if (m) m.classList.remove("show");
    }

    function drawSimpleQr(text) {
        var canvas = document.getElementById("qrCanvas");
        if (!canvas || !canvas.getContext) return;
        var ctx = canvas.getContext("2d");
        var w = 240;
        canvas.width = w;
        canvas.height = w;
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, w, w);
        if (!text) return;

        var n = 21;
        var cell = Math.floor((w - 24) / n);
        var offset = Math.floor((w - cell * n) / 2);

        var bits = [];
        for (var i = 0; i < text.length; i++) {
            var code = text.charCodeAt(i);
            for (var b = 7; b >= 0; b--) {
                bits.push((code >> b) & 1);
            }
        }
        while (bits.length < 300) {
            bits.push((bits.length * 3 + 1) % 2);
        }

        ctx.fillStyle = "#000000";
        var k = 0;
        for (var r = 0; r < n; r++) {
            for (var c = 0; c < n; c++) {
                var tl = (r < 7 && c < 7);
                var tr = (r < 7 && c >= n - 7);
                var bl = (r >= n - 7 && c < 7);
                var black = false;

                if (tl || tr || bl) {
                    var lr = r, lc = c;
                    if (tr) lc = c - (n - 7);
                    if (bl) lr = r - (n - 7);
                    black = (lr === 0 || lr === 6 || lc === 0 || lc === 6 || (lr >= 2 && lr <= 4 && lc >= 2 && lc <= 4));
                } else if (r === 6 || c === 6) {
                    black = ((r + c) % 2 === 0);
                } else {
                    black = bits[k % bits.length] === 1;
                    k++;
                }

                if (black) {
                    ctx.fillRect(offset + c * cell, offset + r * cell, cell, cell);
                }
            }
        }
    }

    function renderCart() {
        var list = document.getElementById("cartList");
        var sumEl = document.getElementById("cartSum");
        var total = calcTotal();
        if (sumEl) sumEl.textContent = String(total);
        if (!list) return;

        if (cart.length === 0) {
            list.innerHTML = "<div style='padding:14px;text-align:center;color:#475569;font-weight:bold;'>السلة فارغة حالياً</div>";
            return;
        }

        var out = "";
        for (var i = 0; i < cart.length; i++) {
            var item = cart[i];
            var line = (Number(item.price) || 0) * (Number(item.qty) || 1);
            out += "<div class='cart-row'>" +
                "<div>" +
                "<div style='font-weight:bold;'>" + esc(item.name) + "</div>" +
                "<div style='font-size:13px;color:#15803d;font-weight:bold;'>الكمية: " + item.qty + " | المجموع: " + line + " د.ل</div>" +
                "</div>" +
                "<div class='row'>" +
                "<button type='button' class='btn-blue' style='padding:6px 10px;' data-plus='" + i + "'>+</button>" +
                "<button type='button' class='btn-blue' style='padding:6px 10px;' data-minus='" + i + "'>-</button>" +
                "<button type='button' class='btn-red' style='padding:6px 10px;' data-del='" + i + "'>×</button>" +
                "</div>" +
                "</div>";
        }
        list.innerHTML = out;
    }

    function openResult(items) {
        foundItems = items || [];
        var list = document.getElementById("resultList");
        if (!list) return;

        var out = "";
        for (var i = 0; i < foundItems.length; i++) {
            var it = foundItems[i];
            var price = Number(it.sale_price) || 0;
            out += "<div class='item-card'>" +
                "<div class='item-name'>" + esc(it.item_name || "بدون اسم") + "</div>" +
                "<div class='item-price'>" + price + " د.ل</div>" +
                "<button type='button' class='btn-orange' style='width:100%;' data-add='" + i + "'>إضافة إلى السلة</button>" +
                "</div>";
        }
        list.innerHTML = out;
        openModal("modalResult");
    }

    function runSearch(mode) {
        var inName = document.getElementById("inName");
        var inBarcode = document.getElementById("inBarcode");
        var q = mode === "barcode"
            ? (inBarcode ? inBarcode.value.trim() : "")
            : (inName ? inName.value.trim() : "");

        if (!q) {
            showMsg("أدخل كلمة البحث أو الباركود أولاً", true);
            return;
        }

        showMsg("جاري البحث...", false);

        var url = SB_URL + "/rest/v1/store_items?store_id=eq." + STORE_ID + "&select=*";
        if (mode === "barcode") {
            url += "&barcode=eq." + encodeURIComponent(q);
        } else if (!isNaN(q)) {
            url += "&or=(item_id.eq." + encodeURIComponent(q) + ",barcode.eq." + encodeURIComponent(q) + ")";
        } else {
            url += "&item_name=ilike.*" + encodeURIComponent(q.replace(/[%_*]/g, "")) + "*";
        }

        fetch(url, {
            headers: {
                "apikey": SB_KEY,
                "Authorization": "Bearer " + SB_KEY
            }
        })
        .then(function (r) { return r.json(); })
        .then(function (rows) {
            if (Array.isArray(rows) && rows.length > 0) {
                hideMsg();
                openResult(rows);
            } else {
                showMsg("لم يتم العثور على صنف مطابق", true);
            }
        })
        .catch(function () {
            showMsg("تعذر الاتصال بقاعدة البيانات", true);
        });
    }

    document.getElementById("btnSearchName").addEventListener("click", function () { runSearch("name"); });
    document.getElementById("btnSearchBarcode").addEventListener("click", function () { runSearch("barcode"); });

    document.getElementById("inName").addEventListener("keydown", function (e) {
        if (e.key === "Enter") runSearch("name");
    });
    document.getElementById("inBarcode").addEventListener("keydown", function (e) {
        if (e.key === "Enter") runSearch("barcode");
    });

    document.getElementById("btnOpenCart").addEventListener("click", function () {
        renderCart();
        openModal("modalCart");
    });

    document.getElementById("btnEmptyCart").addEventListener("click", function () {
        cart = [];
        refreshCartBadge();
        renderCart();
    });

    document.getElementById("btnMakeQr").addEventListener("click", function () {
        var total = calcTotal();
        var sumEl = document.getElementById("qrInvoiceSum");
        if (sumEl) sumEl.textContent = String(total);

        var parts = [];
        for (var i = 0; i < cart.length; i++) {
            var code = String(cart[i].code || ("I" + (i + 1))).replace(/[^A-Za-z0-9_-]/g, "");
            parts.push((code || "ITEM") + "*" + cart[i].qty);
        }
        drawSimpleQr(parts.length ? ("CART-" + parts.join("-")) : "");
        openModal("modalQr");
    });

    document.getElementById("resultList").addEventListener("click", function (e) {
        var btn = e.target.closest ? e.target.closest("[data-add]") : null;
        if (!btn) return;
        var idx = Number(btn.getAttribute("data-add"));
        var it = foundItems[idx];
        if (!it) return;

        var key = String(it.barcode || it.item_id || idx);
        var found = null;
        for (var i = 0; i < cart.length; i++) {
            if (cart[i].key === key) { found = cart[i]; break; }
        }
        if (found) {
            found.qty += 1;
        } else {
            cart.push({
                key: key,
                code: key,
                name: String(it.item_name || "بدون اسم"),
                price: Number(it.sale_price) || 0,
                qty: 1
            });
        }
        refreshCartBadge();
        closeModal("modalResult");
        renderCart();
        openModal("modalCart");
    });

    document.getElementById("cartList").addEventListener("click", function (e) {
        var plusBtn = e.target.closest ? e.target.closest("[data-plus]") : null;
        var minusBtn = e.target.closest ? e.target.closest("[data-minus]") : null;
        var delBtn = e.target.closest ? e.target.closest("[data-del]") : null;

        if (plusBtn) {
            var p = Number(plusBtn.getAttribute("data-plus"));
            if (cart[p]) cart[p].qty += 1;
        } else if (minusBtn) {
            var m = Number(minusBtn.getAttribute("data-minus"));
            if (cart[m]) {
                cart[m].qty -= 1;
                if (cart[m].qty <= 0) cart.splice(m, 1);
            }
        } else if (delBtn) {
            var d = Number(delBtn.getAttribute("data-del"));
            if (cart[d]) cart.splice(d, 1);
        } else {
            return;
        }

        refreshCartBadge();
        renderCart();
    });

    document.getElementById("btnCloseResult").addEventListener("click", function () { closeModal("modalResult"); });
    document.getElementById("btnCloseResultX").addEventListener("click", function () { closeModal("modalResult"); });
    document.getElementById("btnCloseCart").addEventListener("click", function () { closeModal("modalCart"); });
    document.getElementById("btnCloseCartX").addEventListener("click", function () { closeModal("modalCart"); });
    document.getElementById("btnCloseQr").addEventListener("click", function () { closeModal("modalQr"); });
    document.getElementById("btnCloseQrX").addEventListener("click", function () { closeModal("modalQr"); });

    refreshCartBadge();
})();
</script>

</body>
</html>
