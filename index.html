<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعلام الأسعار - سنتر العائلة السعيدة</title>
    <!-- مكتبة قراءة الباركود بالكاميرا -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #eef2f7 0%, #dbe4f0 100%);
            --card-bg: #ffffff;
            --header-gradient: linear-gradient(135deg, #162447 0%, #1f4068 60%, #1b6ca8 100%);
            --accent-gold: #ffd166;
            --primary-blue: #1b6ca8;
            --primary-blue-hover: #145382;
            --success-green: #15803d;
            --success-bright: #16a34a;
            --success-soft: linear-gradient(135deg, #ecfdf5 0%, #bbf7d0 100%);
            --border-color: #cbd5e1;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --danger-bg: #fef2f2;
            --danger-text: #dc2626;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Tahoma, "Segoe UI", sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            margin: 0;
            padding: 18px 14px;
            color: var(--text-main);
        }

        .container {
            max-width: 560px;
            margin: auto;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 16px 38px rgba(22, 36, 71, 0.16);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.85);
        }

        .hero-header {
            background: var(--header-gradient);
            color: #ffffff;
            padding: 24px 20px;
            text-align: center;
            position: relative;
        }

        .hero-header h2 {
            margin: 0 0 12px 0;
            font-size: 22px;
            letter-spacing: 0.2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* شارة وأيقونة اسم المحل مكبرة وواضحة */
        .store-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, rgba(255, 209, 102, 0.24), rgba(245, 158, 11, 0.18));
            border: 2px solid var(--accent-gold);
            color: #fff3c4;
            font-size: 20px;
            font-weight: bold;
            padding: 9px 22px;
            border-radius: 999px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22);
        }

        .store-icon {
            font-size: 25px;
            line-height: 1;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.25));
        }

        .content-body {
            padding: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 7px;
            color: var(--text-main);
            font-size: 15.5px;
        }

        .search-row {
            display: flex;
            gap: 8px;
            align-items: stretch;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            flex: 1;
            min-width: 0;
        }

        input[type="text"] {
            width: 100%;
            padding: 13px 14px 13px 40px;
            font-size: 16px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            background-color: #f8fafc;
            color: var(--text-main);
            transition: all 0.22s ease;
        }

        input[type="text"]:focus {
            outline: none;
            background-color: #ffffff;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 4px rgba(27, 108, 168, 0.15);
            transform: translateY(-1px);
        }

        .clear-btn {
            position: absolute;
            left: 10px;
            background: #e2e8f0;
            color: #475569;
            border: none;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            font-size: 15px;
            line-height: 1;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            transition: all 0.18s ease;
        }

        .clear-btn:hover {
            background: #cbd5e1;
            color: #0f172a;
        }

        .btn-cam {
            background: linear-gradient(135deg, #1b6ca8, #0ea5e9);
            color: #ffffff;
            border: none;
            padding: 0 14px;
            font-size: 14.5px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            white-space: nowrap;
            box-shadow: 0 4px 12px rgba(27, 108, 168, 0.25);
            transition: all 0.2s ease;
        }

        .btn-cam:hover {
            background: linear-gradient(135deg, #145382, #0284c7);
            transform: translateY(-1px);
        }

        .btn-cam:active {
            transform: scale(0.98);
        }

        .btn-search-inline {
            background: linear-gradient(135deg, #16a34a, #22c55e);
            color: #ffffff;
            border: none;
            padding: 0 15px;
            font-size: 14.5px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            white-space: nowrap;
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.25);
            transition: all 0.2s ease;
        }

        .btn-search-inline:hover {
            background: linear-gradient(135deg, #15803d, #16a34a);
            transform: translateY(-1px);
        }

        .btn-search-inline:active {
            transform: scale(0.98);
        }

        #reader {
            width: 100%;
            max-width: 420px;
            margin: 14px auto;
            border-radius: 12px;
            overflow: hidden;
            display: none;
            border: 2px solid var(--primary-blue);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
        }

        .status-msg {
            margin-top: 18px;
            padding: 14px 16px;
            border-radius: 12px;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            animation: modalPop 0.22s ease-out;
        }

        .status-loading {
            background: #eff6ff;
            color: var(--primary-blue);
            border: 1px solid #bfdbfe;
        }

        .status-error {
            background: var(--danger-bg);
            color: var(--danger-text);
            border: 1px solid #fecaca;
        }

        /* النافذة المنبثقة (Modal) لعرض نتيجة البحث */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 9999;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            width: 100%;
            max-width: 480px;
            max-height: 88vh;
            overflow-y: auto;
            background: #ffffff;
            border-radius: 22px;
            box-shadow: 0 24px 55px rgba(15, 23, 42, 0.35);
            border: 2px solid #e2e8f0;
            animation: modalPop 0.24s cubic-bezier(0.16, 1, 0.3, 1);
            overflow-x: hidden;
        }

        @keyframes modalPop {
            from {
                opacity: 0;
                transform: scale(0.92) translateY(10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal-top-bar {
            background: var(--header-gradient);
            color: #ffffff;
            padding: 16px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .modal-store-title {
            font-size: 19px;
            font-weight: bold;
            color: #fff3c4;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal-close-icon {
            background: rgba(255, 255, 255, 0.16);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.18s ease;
        }

        .modal-close-icon:hover {
            background: rgba(239, 68, 68, 0.85);
            border-color: transparent;
        }

        .modal-body {
            padding: 20px 18px;
        }

        .modal-result-card {
            background: linear-gradient(180deg, #f8fafc 0%, #ffffff 100%);
            border: 2px solid #cbd5e1;
            border-top: 6px solid var(--primary-blue);
            border-radius: 18px;
            padding: 20px 16px;
            margin-bottom: 14px;
            box-shadow: 0 8px 22px rgba(15, 23, 42, 0.08);
            text-align: center;
        }

        .modal-result-card:last-child {
            margin-bottom: 0;
        }

        .modal-item-name {
            font-size: 23px;
            font-weight: bold;
            color: #0f172a;
            line-height: 1.5;
            margin-bottom: 18px;
            padding-bottom: 14px;
            border-bottom: 2px dashed #cbd5e1;
        }

        .modal-price-panel {
            background: var(--success-soft);
            border: 2px solid #4ade80;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 8px 20px rgba(22, 163, 74, 0.16);
        }

        .modal-price-caption {
            font-size: 17px;
            font-weight: bold;
            color: #14532d;
            margin-bottom: 6px;
        }

        .modal-price-value {
            font-size: 34px;
            font-weight: bold;
            color: #15803d;
            line-height: 1.15;
            letter-spacing: 0.4px;
        }

        .modal-footer-actions {
            padding: 0 18px 18px 18px;
        }

        .btn-modal-close {
            width: 100%;
            background: linear-gradient(135deg, #162447, #1b6ca8);
            color: #ffffff;
            border: none;
            padding: 13px;
            font-size: 17px;
            font-weight: bold;
            border-radius: 13px;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(22, 36, 71, 0.24);
            transition: all 0.2s ease;
        }

        .btn-modal-close:hover {
            filter: brightness(1.08);
            transform: translateY(-1px);
        }

        @media (max-width: 480px) {
            .search-row {
                flex-wrap: wrap;
            }
            .input-wrapper {
                flex-basis: 100%;
            }
            .btn-cam,
            .btn-search-inline {
                flex: 1;
                padding: 11px 12px;
                font-size: 15px;
            }
            .modal-item-name {
                font-size: 21px;
            }
            .modal-price-value {
                font-size: 30px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="hero-header">
        <h2>🔍 استعلام الأسعار السريع</h2>
        <div class="store-badge">
            <span class="store-icon">🏪</span>
            <span>معرض سنتر العائلة</span>
        </div>
    </div>

    <div class="content-body">
        <!-- المربع الأول: البحث باسم المادة أو رقم الصنف + زر البحث بجانبه -->
        <div class="form-group">
            <label for="nameOrIdInput">1. البحث باسم المادة أو رقم الصنف</label>
            <div class="search-row">
                <div class="input-wrapper">
                    <input type="text" id="nameOrIdInput" placeholder="اكتب اسم المادة أو رقم الصنف...">
                    <button type="button" id="clearNameBtn" class="clear-btn" title="مسح">×</button>
                </div>
                <button type="button" id="searchNameBtn" class="btn-search-inline">بحث فوراً 🔍</button>
            </div>
        </div>

        <!-- المربع الثاني: كتابة الباركود أو قراءته بالكاميرا + زر الكاميرا وزر البحث بجانبه -->
        <div class="form-group">
            <label for="barcodeInput">2. البحث بالباركود أو الكاميرا</label>
            <div class="search-row">
                <div class="input-wrapper">
                    <input type="text" id="barcodeInput" placeholder="اكتب الباركود أو امسحه بالكاميرا...">
                    <button type="button" id="clearBarcodeBtn" class="clear-btn" title="مسح">×</button>
                </div>
                <button type="button" id="cameraBtn" class="btn-cam">📷 كاميرا</button>
                <button type="button" id="searchBarcodeBtn" class="btn-search-inline">بحث فوراً 🔍</button>
            </div>
        </div>

        <div id="reader"></div>

        <div id="results"></div>
    </div>
</div>

<!-- النافذة المنبثقة لعرض الصنف والسعر -->
<div id="resultModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modalStoreTitle">
    <div class="modal-box" onclick="event.stopPropagation()">
        <div class="modal-top-bar">
            <div id="modalStoreTitle" class="modal-store-title">
                <span>🏪</span>
                <span>سنتر العائلة السعيدة</span>
            </div>
            <button type="button" id="closeModalTopBtn" class="modal-close-icon" title="إغلاق">×</button>
        </div>
        <div id="modalBody" class="modal-body"></div>
        <div class="modal-footer-actions">
            <button type="button" id="closeModalBottomBtn" class="btn-modal-close">إغلاق النافذة</button>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://romlgjbchyrwlwpcgffi.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJvbWxnamJjaHlyd2x3cGNnZmZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2MDMxNDUsImV4cCI6MjEwMjE3OTE0NX0.wg90ZMVaVMV1UAriGXNEhYqnWlCDzqFjZY87UqSTxbw";
    const FIXED_STORE_ID = "2";

    let html5QrCode = null;
    let cameraIsRunning = false;

    function openResultModal(items) {
        const modal = document.getElementById('resultModal');
        const modalBody = document.getElementById('modalBody');
        if (!modal || !modalBody) return;

        let html = "";
        items.forEach(item => {
            const itemName = item.item_name || 'بدون اسم';
            const salePrice = (item.sale_price !== undefined && item.sale_price !== null) ? item.sale_price : 0;
            html += `
                <div class="modal-result-card">
                    <div class="modal-item-name">📦 ${itemName}</div>
                    <div class="modal-price-panel">
                        <div class="modal-price-caption">سعر البيع</div>
                        <div class="modal-price-value">${salePrice} د.ل</div>
                    </div>
                </div>
            `;
        });

        modalBody.innerHTML = html;
        modal.classList.add('active');
    }

    function closeResultModal() {
        const modal = document.getElementById('resultModal');
        if (modal) {
            modal.classList.remove('active');
        }
    }

    function toggleClearButton(inputId, btnId) {
        const input = document.getElementById(inputId);
        const btn = document.getElementById(btnId);
        if (!input || !btn) return;
        btn.style.display = input.value.trim().length > 0 ? "flex" : "none";
    }

    function clearField(inputId, btnId) {
        const input = document.getElementById(inputId);
        if (!input) return;
        input.value = "";
        toggleClearButton(inputId, btnId);
        input.focus();
    }

    function playScanBeep() {
        try {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return;
            const ctx = new AudioCtx();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = "sine";
            osc.frequency.value = 880;
            gain.gain.value = 0.08;
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            setTimeout(() => {
                try {
                    osc.stop();
                    ctx.close();
                } catch (e) {}
            }, 120);
        } catch (e) {}
    }

    async function stopCamera() {
        const readerDiv = document.getElementById('reader');
        const camBtn = document.getElementById('cameraBtn');
        if (cameraIsRunning && html5QrCode) {
            try {
                await html5QrCode.stop();
                await html5QrCode.clear();
            } catch (err) {
                console.error(err);
            }
        }
        if (readerDiv) readerDiv.style.display = 'none';
        if (camBtn) camBtn.textContent = '📷 كاميرا';
        cameraIsRunning = false;
    }

    async function toggleCamera() {
        const readerDiv = document.getElementById('reader');
        const camBtn = document.getElementById('cameraBtn');
        const resultsDiv = document.getElementById('results');

        if (typeof Html5Qrcode === "undefined") {
            resultsDiv.innerHTML = "<div class='status-msg status-error'>⚠️ مكتبة الكاميرا لم تُحمّل بعد، تأكد من الاتصال بالإنترنت.</div>";
            return;
        }

        if (!cameraIsRunning) {
            try {
                readerDiv.style.display = 'block';
                if (camBtn) camBtn.textContent = '✖ إغلاق';
                html5QrCode = new Html5Qrcode("reader");
                await html5QrCode.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: { width: 250, height: 100 } },
                    async (decodedText) => {
                        const cleanCode = (decodedText || "").trim();
                        playScanBeep();
                        const barcodeInput = document.getElementById('barcodeInput');
                        const nameInput = document.getElementById('nameOrIdInput');
                        if (barcodeInput) {
                            barcodeInput.value = cleanCode;
                            toggleClearButton('barcodeInput', 'clearBarcodeBtn');
                        }
                        if (nameInput) {
                            nameInput.value = "";
                            toggleClearButton('nameOrIdInput', 'clearNameBtn');
                        }
                        await stopCamera();
                        searchItem('barcode');
                    }
                );
                cameraIsRunning = true;
            } catch (err) {
                console.error(err);
                await stopCamera();
                resultsDiv.innerHTML = "<div class='status-msg status-error'>⚠️ تعذر تشغيل الكاميرا، تأكد من منح صلاحية الكاميرا للمتصفح.</div>";
            }
        } else {
            await stopCamera();
        }
    }

    async function searchItem(preferredField = null) {
        const nameOrIdInput = document.getElementById('nameOrIdInput');
        const barcodeInput = document.getElementById('barcodeInput');
        const resultsDiv = document.getElementById('results');

        const nameOrIdVal = nameOrIdInput ? nameOrIdInput.value.trim() : "";
        const barcodeVal = barcodeInput ? barcodeInput.value.trim() : "";

        let activeQuery = "";
        let searchMode = "";

        if (preferredField === 'barcode') {
            activeQuery = barcodeVal;
            searchMode = "barcode";
        } else if (preferredField === 'nameOrId') {
            activeQuery = nameOrIdVal;
            searchMode = "nameOrId";
        } else if (nameOrIdVal) {
            activeQuery = nameOrIdVal;
            searchMode = "nameOrId";
        } else if (barcodeVal) {
            activeQuery = barcodeVal;
            searchMode = "barcode";
        }

        if (!activeQuery) {
            resultsDiv.innerHTML = "<div class='status-msg status-error'>⚠️ الرجاء إدخال اسم المادة، رقم الصنف، أو الباركود أولاً.</div>";
            return;
        }

        resultsDiv.innerHTML = "<div class='status-msg status-loading'>⏳ جاري البحث في قائمة الأسعار...</div>";

        try {
            let apiUrl = `${SUPABASE_URL}/rest/v1/store_items?store_id=eq.${FIXED_STORE_ID}&select=*`;

            if (searchMode === "barcode") {
                apiUrl += `&barcode=eq.${encodeURIComponent(activeQuery)}`;
            } else {
                if (!isNaN(activeQuery)) {
                    apiUrl += `&or=(item_id.eq.${encodeURIComponent(activeQuery)},barcode.eq.${encodeURIComponent(activeQuery)})`;
                } else {
                    const safeName = activeQuery.replace(/[%_*]/g, "");
                    apiUrl += `&item_name=ilike.*${encodeURIComponent(safeName)}*`;
                }
            }

            const response = await fetch(apiUrl, {
                method: 'GET',
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${SUPABASE_KEY}`,
                    'Content-Type': 'application/json'
                }
            });

            if (!response.ok) {
                resultsDiv.innerHTML = `<div class='status-msg status-error'>❌ خطأ في الاتصال بالسحابة: ${response.statusText}</div>`;
                return;
            }

            const data = await response.json();

            if (data && data.length > 0) {
                resultsDiv.innerHTML = "";
                openResultModal(data);
            } else {
                resultsDiv.innerHTML = `<div class='status-msg status-error'>⚠️ لم يتم العثور على أي صنف مطابق في سنتر العائلة السعيدة.</div>`;
            }
        } catch (err) {
            resultsDiv.innerHTML = `<div class='status-msg status-error'>❌ خطأ في النظام: ${err.message}</div>`;
        }
    }

    document.addEventListener("DOMContentLoaded", function () {
        const nameInput = document.getElementById('nameOrIdInput');
        const barcodeInput = document.getElementById('barcodeInput');
        const clearNameBtn = document.getElementById('clearNameBtn');
        const clearBarcodeBtn = document.getElementById('clearBarcodeBtn');
        const cameraBtn = document.getElementById('cameraBtn');
        const searchNameBtn = document.getElementById('searchNameBtn');
        const searchBarcodeBtn = document.getElementById('searchBarcodeBtn');
        const resultModal = document.getElementById('resultModal');
        const closeModalTopBtn = document.getElementById('closeModalTopBtn');
        const closeModalBottomBtn = document.getElementById('closeModalBottomBtn');

        if (nameInput) {
            nameInput.addEventListener('input', () => toggleClearButton('nameOrIdInput', 'clearNameBtn'));
            nameInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') searchItem('nameOrId');
            });
            toggleClearButton('nameOrIdInput', 'clearNameBtn');
        }

        if (barcodeInput) {
            barcodeInput.addEventListener('input', () => toggleClearButton('barcodeInput', 'clearBarcodeBtn'));
            barcodeInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') searchItem('barcode');
            });
            toggleClearButton('barcodeInput', 'clearBarcodeBtn');
        }

        if (clearNameBtn) {
            clearNameBtn.addEventListener('click', () => clearField('nameOrIdInput', 'clearNameBtn'));
        }

        if (clearBarcodeBtn) {
            clearBarcodeBtn.addEventListener('click', () => clearField('barcodeInput', 'clearBarcodeBtn'));
        }

        if (cameraBtn) {
            cameraBtn.addEventListener('click', toggleCamera);
        }

        if (searchNameBtn) {
            searchNameBtn.addEventListener('click', () => searchItem('nameOrId'));
        }

        if (searchBarcodeBtn) {
            searchBarcodeBtn.addEventListener('click', () => searchItem('barcode'));
        }

        if (closeModalTopBtn) {
            closeModalTopBtn.addEventListener('click', closeResultModal);
        }

        if (closeModalBottomBtn) {
            closeModalBottomBtn.addEventListener('click', closeResultModal);
        }

        if (resultModal) {
            resultModal.addEventListener('click', closeResultModal);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeResultModal();
            }
        });
    });
</script>

</body>
</html>
