<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعلام الأسعار - معرض سنتر العائلة</title>
    <!-- مكتبة مسح الباركود عبر الكاميرا -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --container-bg: rgba(30, 41, 59, 0.85);
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: #0b0f19;
            --border-color: #334155;
            --card-bg: linear-gradient(145deg, #1e293b, #0f172a);
            --accent-color: #38bdf8;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-gradient: linear-gradient(135deg, #e0f2fe 0%, #f1f5f9 100%);
                --container-bg: rgba(255, 255, 255, 0.95);
                --text-color: #0f172a;
                --text-muted: #64748b;
                --input-bg: #f8fafc;
                --border-color: #cbd5e1;
                --card-bg: linear-gradient(145deg, #ffffff, #f1f5f9);
                --accent-color: #0284c7;
            }
        }

        body { 
            font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; 
            background: var(--bg-gradient); 
            background-attachment: fixed;
            color: var(--text-color); 
            margin: 0; 
            padding: 20px; 
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container { 
            width: 100%;
            max-width: 600px; 
            background: var(--container-bg); 
            backdrop-filter: blur(12px);
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25); 
            border: 1px solid var(--border-color);
        }

        h2 { 
            text-align: center; 
            color: var(--accent-color); 
            margin-top: 0; 
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .store-tag { 
            text-align: center; 
            color: #fb923c; 
            font-size: 16px; 
            font-weight: 700; 
            margin-bottom: 25px; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        /* أزرار تحديد نمط البحث بتصميم تفاعلي جذاب */
        .search-mode-selector { 
            display: flex; 
            justify-content: center; 
            gap: 15px; 
            margin-bottom: 16px; 
            background: var(--input-bg); 
            padding: 10px; 
            border-radius: 12px; 
            border: 1px solid var(--border-color); 
        }
        .search-mode-selector label { 
            font-size: 14px; 
            cursor: pointer; 
            font-weight: 700; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            transition: color 0.2s;
        }
        .search-mode-selector label:hover { color: var(--accent-color); }

        .search-box-wrapper { display: flex; gap: 10px; margin-bottom: 20px; }
        
        input[type="text"] { 
            width: 100%; 
            padding: 16px; 
            font-size: 16px; 
            border-radius: 12px; 
            border: 2px solid var(--border-color); 
            background: var(--input-bg); 
            color: var(--text-color); 
            box-sizing: border-box; 
            text-align: center; 
            font-weight: 800; 
            flex: 1; 
            transition: all 0.2s ease;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.15);
        }
        
        .btn-action { 
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); 
            color: white; 
            border: none; 
            padding: 0 22px; 
            border-radius: 12px; 
            font-weight: 700; 
            cursor: pointer; 
            font-size: 15px; 
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
            transition: transform 0.2s, box-shadow 0.2s; 
            white-space: nowrap; 
        }
        .btn-action:hover { 
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(2, 132, 199, 0.4); 
        }

        .btn-scan { 
            background: linear-gradient(135deg, #10b981 0%, #059669 100%); 
            color: white; 
            border: none; 
            padding: 0 22px; 
            border-radius: 12px; 
            font-weight: 700; 
            cursor: pointer; 
            font-size: 15px; 
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            transition: transform 0.2s, box-shadow 0.2s; 
            white-space: nowrap; 
        }
        .btn-scan:hover { 
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(16, 185, 129, 0.4); 
        }

        #reader { width: 100%; max-width: 400px; margin: 0 auto 20px auto; border-radius: 14px; overflow: hidden; display: none; border: 3px solid var(--accent-color); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }

        .items-results { display: flex; flex-direction: column; gap: 15px; max-height: 480px; overflow-y: auto; margin-top: 15px; }
        
        .item-card { 
            background: var(--card-bg); 
            border: 1px solid var(--border-color); 
            padding: 24px; 
            border-radius: 16px; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            text-align: center; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .item-name { font-size: 20px; font-weight: 800; color: var(--accent-color); letter-spacing: -0.3px; }
        
        /* مربع عرض سعر البيع المميز للزبائن */
        .price-box { 
            background: rgba(74, 222, 128, 0.08); 
            padding: 18px; 
            border-radius: 12px; 
            border: 2px dashed rgba(74, 222, 128, 0.4); 
        }
        .price-label { font-size: 14px; color: var(--text-muted); margin-bottom: 6px; font-weight: 700; }
        .price-value { font-size: 34px; font-weight: 900; color: #22c55e; letter-spacing: -0.5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🏷️ معرض سنتر العائلة</h2>
    <div class="store-tag">الأستعلام عن السعر </div>

    <!-- خيارات تحديد طريقة البحث -->
    <div class="search-mode-selector">
        <label><input type="radio" name="searchMode" value="barcode_only" checked> 🏷️بحث باركود </label>
        <label><input type="radio" name="searchMode" value="barcode_and_text"> 🔍 بحث باسم المادة</label>
    </div>

    <!-- مربع البحث والماسح -->
    <div class="search-box-wrapper">
        <input type="text" id="itemSearchInput" placeholder="أدخل رقم الباركود أو النص..." onkeydown="if(event.key === 'Enter') searchItems()">
        <button class="btn-action" onclick="searchItems()">بحث 🔍</button>
        <button class="btn-scan" onclick="toggleCameraScanner()">كاميرا 📷</button>
    </div>

    <!-- نافذة الكاميرا -->
    <div id="reader"></div>

    <div id="itemsLoading" style="text-align: center; color: var(--text-muted); display: none; font-size: 14px; font-weight: 700; margin-bottom: 12px;">⏳ جاري جلب السعر...</div>
    
    <div class="items-results" id="itemsResultsContainer">
        <div style="text-align: center; color: var(--text-muted); font-size: 15px; padding: 25px; font-weight: 500;">امسح أو أدخل الباركود لمعرفة سعر البيع الفوري...</div>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://romlgjbchyrwlwpcgffi.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJvbWxnamJjaHlyd2x3cGNnZmZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2MDMxNDUsImV4cCI6MjEwMjE3OTE0NX0.wg90ZMVaVMV1UAriGXNEhYqnWlCDzqFjZY87UqSTxbw";
    
    const storeId = "2"; 
    let html5QrcodeScanner = null;

    async function searchItems(overrideQuery = null) {
        const rawQuery = overrideQuery !== null ? overrideQuery : document.getElementById('itemSearchInput').value;
        const query = rawQuery.trim();
        const resultsContainer = document.getElementById('itemsResultsContainer');
        const loadingIndicator = document.getElementById('itemsLoading');
        const selectedMode = document.querySelector('input[name="searchMode"]:checked').value;

        if (query.length < 1) {
            resultsContainer.innerHTML = '<div style="text-align: center; color: var(--text-muted); font-size: 15px; padding: 25px;">ادخل القيمة للبحث...</div>';
            return;
        }

        loadingIndicator.style.display = 'block';

        try {
            let fetchUrl = "";

            if (selectedMode === "barcode_only") {
                fetchUrl = `${SUPABASE_URL}/rest/v1/store_items?store_id=eq.${storeId}&barcode=eq.${encodeURIComponent(query)}&limit=20&select=*`;
            } else {
                fetchUrl = `${SUPABASE_URL}/rest/v1/store_items?store_id=eq.${storeId}&or=(barcode.eq.${encodeURIComponent(query)},item_name.ilike.*${encodeURIComponent(query)}*)&limit=20&select=*`;
            }

            const response = await fetch(fetchUrl, {
                method: 'GET',
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${SUPABASE_KEY}`,
                    'Content-Type': 'application/json'
                }
            });

            const items = await response.json();
            loadingIndicator.style.display = 'none';

            if (items && items.length > 0) {
                let html = '';
                items.forEach(item => {
                    html += `
                        <div class="item-card">
                            <div class="item-name">${item.item_name}</div>
                            <div style="font-size: 13px; color: var(--text-muted); font-weight: 700;">الباركود: ${item.barcode || 'بدون باركود'}</div>
                            <div class="price-box">
                                <div class="price-label">السعر  </div>
                                <div class="price-value">${Number(item.sale_price || 0).toFixed(2)} د.ل</div>
                            </div>
                        </div>
                    `;
                });
                resultsContainer.innerHTML = html;
            } else {
                resultsContainer.innerHTML = `<div style="text-align: center; color: #f87171; font-size: 15px; padding: 25px; font-weight: 700;">❌ لا توجد مادة مطابقة للبحث (${selectedMode === 'barcode_only' ? 'الباركود غير موجود' : 'الباركود أو الاسم غير موجود'})</div>`;
            }

        } catch (err) {
            loadingIndicator.style.display = 'none';
            console.error("خطأ في البحث:", err);
        }
    }

    function toggleCameraScanner() {
        const readerDiv = document.getElementById('reader');
        if (readerDiv.style.display === 'block') {
            stopScanner();
        } else {
            readerDiv.style.display = 'block';
            html5QrcodeScanner = new Html5Qrcode("reader");
            html5QrcodeScanner.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 150 } },
                (decodedText) => {
                    document.getElementById('itemSearchInput').value = decodedText;
                    searchItems(decodedText);
                    stopScanner();
                },
                (errorMessage) => {}
            ).catch(err => {
                alert("⚠️ لا يمكن فتح الكاميرا، يرجى التأكد من إعطاء المتصفح صلاحية الكاميرا.");
                stopScanner();
            });
        }
    }

    function stopScanner() {
        const readerDiv = document.getElementById('reader');
        if (html5QrcodeScanner) {
            html5QrcodeScanner.stop().then(() => {
                html5QrcodeScanner.clear();
                readerDiv.style.display = 'none';
            }).catch(() => {
                readerDiv.style.display = 'none';
            });
        } else {
            readerDiv.style.display = 'none';
        }
    }
</script>

</body>
</html>
