<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعلام الأسعار - سنتر العائلة السعيدة</title>
    <!-- مكتبة قراءة الباركود بالكاميرا -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #eef2f7 0%, #dbe4f0 100%);
            --shopping-bg: url("https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=1600&q=80");
            --card-bg: rgba(255, 255, 255, 0.96);
            --header-gradient: linear-gradient(135deg, #162447 0%, #1f4068 60%, #1b6ca8 100%);
            --accent-gold: #ffd166;
            --primary-blue: #1b6ca8;
            --primary-blue-hover: #145382;
            --success-green: #15803d;
            --success-bright: #16a34a;
            --success-soft: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
            --border-color: #cbd5e1;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --danger-bg: #fef2f2;
            --danger-text: #dc2626;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Tahoma, "Segoe UI", sans-serif;
            background-color: #162447;
            background-image:
                linear-gradient(rgba(15, 23, 42, 0.42), rgba(22, 36, 71, 0.52)),
                var(--shopping-bg),
                var(--bg-gradient);
            background-size: cover, cover, cover;
            background-position: center, center, center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            margin: 0;
            padding: 18px 14px;
            color: var(--text-main);
        }

        .container {
            max-width: 560px;
            margin: auto;
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 20px;
            box-shadow: 0 18px 42px rgba(0, 0, 0, 0.28);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.85);
        }

        .hero-header {
            background: var(--header-gradient);
            color: #ffffff;
            padding: 24px 20px;
            text-align: center;
            position: relative;
        }

        .hero-header h2 {
            margin: 0 0 12px 0;
            font-size: 22px;
            letter-spacing: 0.2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* شارة وأيقونة اسم المحل مكبرة وواضحة */
        .store-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, rgba(255, 209, 102, 0.24), rgba(245, 158, 11, 0.18));
            border: 2px solid var(--accent-gold);
            color: #fff3c4;
            font-size: 20px;
            font-weight: bold;
            padding: 9px 22px;
            border-radius: 999px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22);
        }

        .store-icon {
            font-size: 25px;
            line-height: 1;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.25));
        }

        .content-body {
            padding: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 7px;
            color: var(--text-main);
            font-size: 15.5px;
        }

        .search-row {
            display: flex;
            gap: 8px;
            align-items: stretch;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            flex: 1;
            min-width: 0;
        }

        input[type="text"] {
            width: 100%;
            padding: 13px 14px 13px 40px;
            font-size: 16px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            background-color: #f8fafc;
            color: var(--text-main);
            transition: all 0.22s ease;
        }

        input[type="text"]:focus {
            outline: none;
            background-color: #ffffff;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 4px rgba(27, 108, 168, 0.15);
            transform: translateY(-1px);
        }

        .clear-btn {
            position: absolute;
            left: 10px;
            background: #e2e8f0;
            color: #475569;
            border: none;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            font-size: 15px;
            line-height: 1;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            transition: all 0.18s ease;
        }

        .clear-btn:hover {
            background: #cbd5e1;
            color: #0f172a;
        }

        .btn-cam {
            background: linear-gradient(135deg, #1b6ca8, #0ea5e9);
            color: #ffffff;
            border: none;
            padding: 0 14px;
            font-size: 14.5px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            white-space: nowrap;
            box-shadow: 0 4px 12px rgba(27, 108, 168, 0.25);
            transition: all 0.2s ease;
        }

        .btn-cam:hover {
            background: linear-gradient(135deg, #145382, #0284c7);
            transform: translateY(-1px);
        }

        .btn-cam:active {
            transform: scale(0.98);
        }

        .btn-search-inline {
            background: linear-gradient(135deg, #16a34a, #22c55e);
            color: #ffffff;
            border: none;
            padding: 0 15px;
            font-size: 14.5px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            white-space: nowrap;
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.25);
            transition: all 0.2s ease;
        }

        .btn-search-inline:hover {
            background: linear-gradient(135deg, #15803d, #16a34a);
            transform: translateY(-1px);
        }

        .btn-search-inline:active {
            transform: scale(0.98);
        }

        #reader {
            width: 100%;
            max-width: 420px;
            margin: 14px auto;
            border-radius: 12px;
            overflow: hidden;
            display: none;
            border: 2px solid var(--primary-blue);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
        }

        .results-count {
            margin-top: 22px;
            margin-bottom: 12px;
            font-size: 18px;
            font-weight: bold;
            color: #16325b;
            background: linear-gradient(90deg, #eff6ff 0%, #dbeafe 100%);
            border-right: 5px solid var(--primary-blue);
            padding: 11px 15px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(27, 108, 168, 0.08);
        }

        .item-card {
            background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
            border: 1px solid #dbe4ee;
            border-right: 6px solid var(--success-bright);
            padding: 18px 16px;
            border-radius: 16px;
            margin-top: 14px;
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            animation: cardAppear 0.28s ease-out;
        }

        .item-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px rgba(15, 23, 42, 0.12);
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .item-name {
            font-size: 21px;
            color: var(--text-main);
            font-weight: bold;
            margin-bottom: 14px;
            line-height: 1.5;
            padding-bottom: 10px;
            border-bottom: 1px dashed #cbd5e1;
        }

        .price-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            background: var(--success-soft);
            border: 2px solid #86efac;
            padding: 14px 16px;
            border-radius: 13px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
        }

        .price-label {
            font-size: 18px;
            font-weight: bold;
            color: #14532d;
        }

        .price {
            color: var(--success-green);
            font-weight: bold;
            font-size: 28px;
            line-height: 1.1;
            letter-spacing: 0.3px;
        }

        .status-msg {
            margin-top: 18px;
            padding: 14px 16px;
            border-radius: 12px;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            animation: cardAppear 0.22s ease-out;
        }

        .status-loading {
            background: #eff6ff;
            color: var(--primary-blue);
            border: 1px solid #bfdbfe;
        }

        .status-error {
            background: var(--danger-bg);
            color: var(--danger-text);
            border: 1px solid #fecaca;
        }

        @media (max-width: 480px) {
            body {
                background-attachment: scroll;
            }
            .search-row {
                flex-wrap: wrap;
            }
            .input-wrapper {
                flex-basis: 100%;
            }
            .btn-cam,
            .btn-search-inline {
                flex: 1;
                padding: 11px 12px;
                font-size: 15px;
            }
            .item-name {
                font-size: 19.5px;
            }
            .price {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="hero-header">
        <h2>🔍 استعلام الأسعار السريع</h2>
        <div class="store-badge">
            <span class="store-icon">🏪</span>
            <span>معرض سنتر العائلة</span>
        </div>
    </div>

    <div class="content-body">
        <!-- المربع الأول: البحث باسم المادة أو رقم الصنف + زر البحث بجانبه -->
        <div class="form-group">
            <label for="nameOrIdInput">1. البحث باسم المادة أو رقم الصنف</label>

                    <button type="button" id="clearNameBtn" class="clear-btn" title="مسح">×</button>
                </div>
