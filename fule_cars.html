<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متابعة حركة الفروع النشطة</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --container-bg: #131b2e;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: #0b0f19;
            --border-color: #1e293b;
            --card-bg: #131b2e;
            --accent-glow: rgba(56, 189, 248, 0.12);
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: #f8fafc;
                --container-bg: #ffffff;
                --text-color: #0f172a;
                --text-muted: #64748b;
                --input-bg: #f1f5f9;
                --border-color: #e2e8f0;
                --card-bg: #ffffff;
                --accent-glow: rgba(2, 132, 199, 0.08);
            }
        }

        * { box-sizing: border-box; }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 14px;
            transition: background-color 0.25s ease;
        }

        .page-wrap {
            max-width: 1120px;
            margin: auto;
        }

        .top-panel {
            background: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 18px 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
            margin-bottom: 16px;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 14px;
        }

        h1 {
            margin: 0;
            font-size: 21px;
            font-weight: 800;
            color: #38bdf8;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 3px;
        }

        .meta-badges {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .today-badge {
            font-size: 12px;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 20px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
        }

        .auto-badge {
            font-size: 12px;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 20px;
            background: rgba(34, 197, 94, 0.12);
            border: 1px solid rgba(34, 197, 94, 0.35);
            color: #22c55e;
        }

        .btn {
            padding: 11px 16px;
            border-radius: 10px;
            border: none;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #fff;
        }

        .btn-primary:hover {
            filter: brightness(1.08);
            transform: translateY(-1px);
        }

        .status-banner {
            text-align: center;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 14px;
            display: none;
        }

        .status-loading {
            display: block;
            background: rgba(56, 189, 248, 0.12);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .status-error {
            display: block;
            background: rgba(239, 68, 68, 0.12);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.35);
        }

        .branches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 14px;
        }

        .branch-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .branch-card:hover {
            transform: translateY(-2px);
            border-color: rgba(56, 189, 248, 0.45);
        }

        .branch-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .branch-name {
            font-size: 16px;
            font-weight: 800;
            color: #38bdf8;
            margin: 0;
        }

        .branch-id {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .sync-pill {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 999px;
            white-space: nowrap;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
        }

        .sync-fresh { color: #22c55e; border-color: rgba(34, 197, 94, 0.35); }
        .sync-warn { color: #eab308; border-color: rgba(234, 179, 8, 0.35); }

        .total-highlight {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-right: 5px solid #eab308;
            border-radius: 12px;
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .total-highlight span {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 700;
        }

        .total-highlight strong {
            font-size: 20px;
            font-weight: 800;
            color: #eab308;
        }

        .movement-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .move-cell {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 9px 10px;
        }

        .move-cell .m-title {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
            display: block;
            margin-bottom: 3px;
        }

        .move-cell .m-val {
            font-size: 14px;
            font-weight: 800;
            display: block;
        }

        .c-cash { color: #22c55e; }
        .c-bank { color: #3b82f6; }
        .c-multi { color: #a855f7; }
        .c-profit { color: #38bdf8; }

        .branch-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 9px;
            gap: 6px;
            flex-wrap: wrap;
        }

        .empty-state {
            text-align: center;
            padding: 32px 16px;
            background: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 600;
        }
    </style>
</head>
<body>
<div class="page-wrap">
    <div class="top-panel">
        <div class="header-row">
            <div>
                <h1>🏢 متابعة حركة الفروع النشطة</h1>
                <div class="subtitle">عرض الفروع المحدّثة خلال آخر 24 ساعة فقط مع تحديث تلقائي مستمر</div>
            </div>
            <div class="meta-badges">
                <div class="auto-badge" id="autoSyncBadge">تحديث تلقائي كل 2 د</div>
                <div class="today-badge" id="todayDateBadge">التاريخ: --/--/----</div>
            </div>
        </div>

        <button class="btn btn-primary" onclick="loadAllBranches()">تحديث الكل 🔄</button>
    </div>

    <div id="statusBanner" class="status-banner"></div>
    <div id="branchesGrid" class="branches-grid"></div>
</div>

<script>
    const SUPABASE_URL = "https://romlgjbchyrwlwpcgffi.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJvbWxnamJjaHlyd2x3cGNnZmZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2MDMxNDUsImV4cCI6MjEwMjE3OTE0NX0.wg90ZMVaVMV1UAriGXNEhYqnWlCDzqFjZY87UqSTxbw";

    const TWENTY_FOUR_HOURS_MS = 24 * 60 * 60 * 1000;
    const AUTO_REFRESH_INTERVAL_MS = 2 * 60 * 1000;

    let branchesComputedList = [];
    let isFetching = false;

    function formatLocalDate(d) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
    }

    function formatMoney(val) {
        return Number(val || 0).toFixed(2) + " د.ل";
    }

    function showBanner(type, message) {
        const banner = document.getElementById('statusBanner');
        banner.className = 'status-banner';
        if (!type) {
            banner.style.display = 'none';
            banner.innerText = '';
            return;
        }
        banner.classList.add(type === 'error' ? 'status-error' : 'status-loading');
        banner.style.display = 'block';
        banner.innerText = message;
    }

    function getSyncInfo(latestIso) {
        if (!latestIso) return null;

        const parsed = new Date(latestIso);
        if (isNaN(parsed.getTime())) return null;

        const ageMs = Date.now() - parsed.getTime();
        // إخفاء أي فرع لا يملك بيانات محدثة خلال آخر 24 ساعة أو تاريخه في المستقبل البعيد غير المنطقي
        if (ageMs > TWENTY_FOUR_HOURS_MS || ageMs < -5 * 60 * 1000) {
            return null;
        }

        const y = parsed.getFullYear();
        const m = String(parsed.getMonth() + 1).padStart(2, '0');
        const d = String(parsed.getDate()).padStart(2, '0');
        const t = parsed.toTimeString().substring(0, 8);
        const diffMin = Math.max(0, Math.floor(ageMs / (1000 * 60)));

        if (diffMin <= 45) {
            return {
                text: "محدّث",
                timeLabel: `${y}/${m}/${d} - ${t}`,
                cssClass: "sync-fresh"
            };
        }

        return {
            text: `منذ ${diffMin} د`,
            timeLabel: `${y}/${m}/${d} - ${t}`,
            cssClass: "sync-warn"
        };
    }

    function computeBranchMetrics(store, rows, todayStr) {
        const storeId = String(store.store_id ?? store.id ?? "");
        const storeName = store.store_name || `فرع ${storeId}`;

        // أحدث سجل للفرع عبر كامل البيانات المتاحة (لقياس 24 ساعة بدقة)
        const storeRows = rows.filter(r => String(r.store_id) === storeId && r.last_update);
        if (!storeRows.length) return null;

        const latestRecord = storeRows[0];
        const syncInfo = getSyncInfo(latestRecord.last_update);
        if (!syncInfo) return null;

        // إعطاء الأولوية لآخر تحديث اليوم إن وُجد، وإلا أحدث تحديث ضمن 24 ساعة
        const todayRows = storeRows.filter(r => String(r.last_update).split('T')[0] === todayStr);
        const targetItem = todayRows.length > 0 ? todayRows[0] : latestRecord;

        const totalCash = Number(targetItem.cash_sales || 0);
        const sumCard = Number(targetItem.card_sales || 0) - Number(targetItem.card_returns || 0);
        const sumMobi = Number(targetItem.mobicash_sales || 0) - Number(targetItem.mobicash_returns || 0);
        const sumYesser = Number(targetItem.yesserpay_sales || 0) - Number(targetItem.yesserpay_returns || 0);
        const sumEdfaq = Number(targetItem.edfaqli_sales || 0) - Number(targetItem.edfaqli_returns || 0);
        const sumMultiGeneralRaw = Number(targetItem.multi_cash_sales || 0) - Number(targetItem.multi_cash_returns || 0);
        const sumMultiSpecial = Number(targetItem.multi_cash_special_sales || 0);
        const sumNetProfit = Number(targetItem.net_profit || 0);

        let netMultiGeneral = sumMultiGeneralRaw - sumMultiSpecial;
        if (netMultiGeneral < 0) netMultiGeneral = 0;

        const cashTotal = totalCash + sumMultiSpecial;
        const bankTotal = sumCard + sumMobi + sumYesser + sumEdfaq + netMultiGeneral;
        const grandTotal = cashTotal + bankTotal;

        return {
            storeId,
            storeName,
            grandTotal,
            cashTotal,
            totalCash,
            sumMultiSpecial,
            bankTotal,
            sumNetProfit,
            syncInfo
        };
    }

    function renderBranches() {
        const grid = document.getElementById('branchesGrid');

        if (!branchesComputedList.length) {
            grid.innerHTML = `<div class="empty-state">لا توجد فروع محدثة خلال آخر 24 ساعة حالياً.</div>`;
            return;
        }

        grid.innerHTML = branchesComputedList.map(b => `
            <div class="branch-card">
                <div class="branch-head">
                    <div>
                        <h3 class="branch-name">🏪 ${b.storeName}</h3>
                        <div class="branch-id">معرّف الفرع: ${b.storeId}</div>
                    </div>
                    <span class="sync-pill ${b.syncInfo.cssClass}">${b.syncInfo.text}</span>
                </div>

                <div class="total-highlight">
                    <span>إجمالي مبيعات الفرع</span>
                    <strong>${formatMoney(b.grandTotal)}</strong>
                </div>

                <div class="movement-grid">
                    <div class="move-cell">
                        <span class="m-title">💵 إجمالي النقدية</span>
                        <span class="m-val c-cash">${formatMoney(b.cashTotal)}</span>
                    </div>
                    <div class="move-cell">
                        <span class="m-title">💳 الخدمات المصرفية</span>
                        <span class="m-val c-bank">${formatMoney(b.bankTotal)}</span>
                    </div>
                    <div class="move-cell">
                        <span class="m-title">🔀 كاش دفع متعدد</span>
                        <span class="m-val c-multi">${formatMoney(b.sumMultiSpecial)}</span>
                    </div>
                    <div class="move-cell">
                        <span class="m-title">📈 صافي الربح</span>
                        <span class="m-val c-profit">${formatMoney(b.sumNetProfit)}</span>
                    </div>
                </div>

                <div class="branch-footer">
                    <span>مبيعات نقدية مباشرة: ${formatMoney(b.totalCash)}</span>
                    <span>آخر تحديث: ${b.syncInfo.timeLabel}</span>
                </div>
            </div>
        `).join('');
    }

    async function loadAllBranches(silent = false) {
        if (isFetching) return;
        isFetching = true;

        const now = new Date();
        const todayStr = formatLocalDate(now);
        const cutoffIso = new Date(now.getTime() - TWENTY_FOUR_HOURS_MS).toISOString();

        document.getElementById('todayDateBadge').innerText = `التاريخ: ${todayStr.replace(/-/g, '/')}`;

        if (!silent) {
            showBanner('loading', '⏳ جاري جلب بيانات الفروع المحدّثة خلال آخر 24 ساعة...');
        }

        const headers = {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json'
        };

        try {
            const [storesRes, salesRes] = await Promise.all([
                fetch(`${SUPABASE_URL}/rest/v1/stores?select=*&order=store_id.asc`, { headers }),
                fetch(`${SUPABASE_URL}/rest/v1/store_sales?select=*&last_update=gte.${encodeURIComponent(cutoffIso)}&order=last_update.desc&limit=3000`, { headers })
            ]);

            if (!storesRes.ok || !salesRes.ok) {
                throw new Error("تعذر جلب البيانات من Supabase (تحقق من الاتصال أو صلاحيات القراءة RLS).");
            }

            const stores = await storesRes.json();
            const sales = await salesRes.json();

            branchesComputedList = (stores || [])
                .map(store => computeBranchMetrics(store, sales || [], todayStr))
                .filter(Boolean);

            showBanner(null, '');
            renderBranches();
        } catch (err) {
            if (!silent) {
                showBanner('error', '❌ ' + err.message);
            }
        } finally {
            isFetching = false;
        }
    }

    // التشغيل الأولي الفوري
    loadAllBranches(false);

    // تحديث تلقائي مستمر كل دقيقتين وعند عودة التبويب للواجهة
    setInterval(() => loadAllBranches(true), AUTO_REFRESH_INTERVAL_MS);
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
            loadAllBranches(true);
        }
    });
</script>
</body>
</html>
