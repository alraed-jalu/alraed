<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة توزيع الوقود الذكية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-gray-100 font-sans p-4">

    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen" class="max-w-md mx-auto bg-white shadow-lg rounded-lg p-6 mt-10">
        <div class="text-center mb-6">
            <span class="text-4xl">⛽</span>
            <h1 class="text-2xl font-bold text-blue-600 mt-2">منظومة توزيع الوقود</h1>
            <p class="text-gray-500 text-sm">أدخل اسم المستخدم وكلمة المرور للدخول</p>
        </div>
        <div class="space-y-4">
            <div>
                <label class="block text-sm text-gray-600 mb-1">اسم المستخدم</label>
                <input type="text" id="login-user" value="developer" class="w-full border p-3 rounded text-sm bg-white">
            </div>
            <div>
                <label class="block text-sm text-gray-600 mb-1">كلمة المرور</label>
                <input type="password" id="login-pass" value="dev123" class="w-full border p-3 rounded text-sm bg-white">
            </div>
            <button onclick="doLogin()" class="w-full bg-blue-600 text-white py-3 rounded font-bold text-base hover:bg-blue-700">دخول للمنظومة</button>
            <p id="login-error" class="text-red-500 text-center text-sm hidden font-bold">خطأ في اسم المستخدم أو كلمة المرور!</p>
            
            <div class="mt-4 p-3 bg-gray-50 rounded border text-xs text-gray-600 space-y-1">
                <p class="font-bold text-gray-700">💡 الحسابات:</p>
                <p>• developer / dev123</p>
                <p>• manager / mng123</p>
                <p>• operator / op123</p>
            </div>
        </div>
    </div>

    <!-- التطبيق الرئيسي -->
    <div id="app-screen" class="max-w-md mx-auto bg-white shadow-lg rounded-lg p-6 hidden">
        <div class="flex justify-between items-center mb-4 bg-blue-600 text-white p-3 rounded">
            <div>
                <h2 id="welcome-role" class="font-bold text-lg">مرحباً</h2>
            </div>
            <button onclick="location.reload()" class="bg-red-500 text-xs px-3 py-1.5 rounded font-bold">خروج</button>
        </div>

        <div class="space-y-4">
            <div class="bg-blue-50 p-3 rounded border">
                <label class="block text-xs font-bold text-blue-900 mb-1">📍 تحديد المحطة الحالية:</label>
                <input type="text" id="station-name-input" value="محطة التوزيع المركزية - رقم (1)" class="w-full border p-2 rounded text-sm bg-white">
            </div>

            <h2 class="text-gray-700 font-semibold text-sm">أدخل كود السيارة أو الباركود</h2>
            <div class="flex gap-2">
                <input type="text" id="barcode-input" placeholder="رقم الكود..." class="flex-1 border p-2 rounded text-sm">
                <button onclick="alert('تم النقر على البحث')" class="bg-blue-600 text-white px-4 py-2 rounded font-bold text-sm">بحث</button>
            </div>
        </div>
    </div>

    <script>
        function doLogin() {
            const u = document.getElementById('login-user').value.trim();
            const p = document.getElementById('login-pass').value.trim();
            const err = document.getElementById('login-error');

            if ((u === 'developer' && p === 'dev123') || 
                (u === 'manager' && p === 'mng123') || 
                (u === 'operator' && p === 'op123')) {
                
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                document.getElementById('welcome-role').textContent = "مرحباً بك: " + u;
            } else {
                err.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
