<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متابعة حركة جميع الفروع</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --container-bg: #131b2e;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: #0b0f19;
            --border-color: #1e293b;
            --card-bg: #131b2e;
            --accent-glow: rgba(56, 189, 248, 0.12);
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: #f8fafc;
                --container-bg: #ffffff;
                --text-color: #0f172a;
                --text-muted: #64748b;
                --input-bg: #f1f5f9;
                --border-color: #e2e8f0;
                --card-bg: #ffffff;
                --accent-glow: rgba(2, 132, 199, 0.08);
            }
        }

        * { box-sizing: border-box; }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 14px;
            transition: background-color 0.25s ease;
        }

        .page-wrap {
            max-width: 1120px;
            margin: auto;
        }

        .top-panel {
            background: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 18px 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
            margin-bottom: 16px;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 14px;
        }

        h1 {
            margin: 0;
            font-size: 21px;
            font-weight: 800;
            color: #38bdf8;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 3px;
        }

        .controls-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
            gap: 10px;
            align-items: end;
        }

        .field-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        input[type="date"], select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-color);
            font-size: 13px;
            font-weight: 600;
        }

        input[type="date"]:focus, select:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .btn {
            padding: 10px 16px;
            border-radius: 10px;
            border: none;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #fff;
        }

        .btn-primary:hover {
            filter: brightness(1.08);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            border-color: #38bdf8;
            color: #38bdf8;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-top: 16px;
        }

        .summary-box {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 13px 15px;
        }

        .summary-box .s-label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 4px;
        }

        .summary-box .s-val {
            font-size: 19px;
            font-weight: 800;
        }

        .status-banner {
            text-align: center;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 14px;
            display: none;
        }

        .status-loading {
            display: block;
            background: rgba(56, 189, 248, 0.12);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .status-error {
            display: block;
            background: rgba(239, 68, 68, 0.12);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.35);
        }

        .branches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 14px;
        }

        .branch-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .branch-card:hover {
            transform: translateY(-2px);
            border-color: rgba(56, 189, 248, 0.45);
        }

        .branch-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .branch-name {
            font-size: 16px;
            font-weight: 800;
            color: #38bdf8;
            margin: 0;
        }

        .branch-id {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .sync-pill {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 999px;
            white-space: nowrap;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
        }

        .sync-fresh { color: #22c55e; border-color: rgba(34, 197, 94, 0.35); }
        .sync-warn { color: #eab308; border-color: rgba(234, 179, 8, 0.35); }
        .sync-stale { color: #f87171; border-color: rgba(248, 113, 113, 0.35); }

        .total-highlight {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-right: 5px solid #eab308;
            border-radius: 12px;
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .total-highlight span {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 700;
        }

        .total-highlight strong {
            font-size: 20px;
            font-weight: 800;
            color: #eab308;
        }

        .movement-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .move-cell {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 9px 10px;
        }

        .move-cell .m-title {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
            display: block;
            margin-bottom: 3px;
        }

        .move-cell .m-val {
            font-size: 14px;
            font-weight: 800;
            display: block;
        }

        .c-cash { color: #22c55e; }
        .c-bank { color: #3b82f6; }
        .c-multi { color: #a855f7; }
        .c-profit { color: #38bdf8; }

        .branch-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 9px;
            gap: 6px;
            flex-wrap: wrap;
        }

        .empty-state {
            text-align: center;
            padding: 32px 16px;
            background: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 600;
        }
    </style>
</head>
<body>
<div class="page-wrap">
    <div class="top-panel">
        <div class="header-row">
            <div>
                <h1>🏢 متابعة حركة جميع الفروع</h1>
                <div class="subtitle">عرض إجمالي مبيعات وحركة كل فرع في شاشة واحدة للفترة المحددة</div>
            </div>
            <button class="btn btn-secondary" onclick="setTodayRange()">اليوم 📅</button>
        </div>

        <div class="controls-bar">
            <div class="field-group">
                <label for="startDate">من تاريخ</label>
                <input type="date" id="startDate">
            </div>

            <div class="field-group">
                <label for="endDate">إلى تاريخ</label>
                <input type="date" id="endDate">
            </div>

            <div class="field-group">
                <label for="filterMode">عرض الفروع</label>
                <select id="filterMode" onchange="renderBranches()">
                    <option value="all">كل الفروع</option>
                    <option value="active">الفروع ذات الحركة فقط</option>
                    <option value="stale">الفروع المتأخرة في التحديث</option>
                </select>
            </div>

            <div class="field-group">
                <label>&nbsp;</label>
                <button class="btn btn-primary" style="width: 100%;" onclick="loadAllBranches()">تحديث الكل 🔄</button>
            </div>
        </div>

        <div class="summary-grid">
            <div class="summary-box">
                <div class="s-label">إجمالي مبيعات كل الفروع</div>
                <div class="s-val" id="allBranchesTotal" style="color: #eab308;">0.00 د.ل</div>
            </div>
            <div class="summary-box">
                <div class="s-label">إجمالي النقدية</div>
                <div class="s-val" id="allBranchesCash" style="color: #22c55e;">0.00 د.ل</div>
            </div>
            <div class="summary-box">
                <div class="s-label">إجمالي الخدمات المصرفية</div>
                <div class="s-val" id="allBranchesBank" style="color: #3b82f6;">0.00 د.ل</div>
            </div>
            <div class="summary-box">
                <div class="s-label">عدد الفروع المعروضة</div>
                <div class="s-val" id="allBranchesCount" style="color: #38bdf8;">0</div>
            </div>
        </div>
    </div>

    <div id="statusBanner" class="status-banner"></div>
    <div id="branchesGrid" class="branches-grid"></div>
</div>

<script>
    const SUPABASE_URL = "https://romlgjbchyrwlwpcgffi.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJvbWxnamJjaHlyd2x3cGNnZmZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2MDMxNDUsImV4cCI6MjEwMjE3OTE0NX0.wg90ZMVaVMV1UAriGXNEhYqnWlCDzqFjZY87UqSTxbw";

    let branchesComputedList = [];

    function formatLocalDate(d) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
    }

    function formatMoney(val) {
        return Number(val || 0).toFixed(2) + " د.ل";
    }

    function setTodayRange() {
        const today = formatLocalDate(new Date());
        document.getElementById('startDate').value = today;
        document.getElementById('endDate').value = today;
        loadAllBranches();
    }

    function showBanner(type, message) {
        const banner = document.getElementById('statusBanner');
        banner.className = 'status-banner';
        if (!type) {
            banner.style.display = 'none';
            banner.innerText = '';
            return;
        }
        banner.classList.add(type === 'error' ? 'status-error' : 'status-loading');
        banner.style.display = 'block';
        banner.innerText = message;
    }

    function getSyncInfo(latestIso) {
        if (!latestIso) {
            return {
                text: "لا يوجد تحديث",
                timeLabel: "--/--/---- --:--:--",
                cssClass: "sync-stale",
                isStale: true
            };
        }

        const parsed = new Date(latestIso);
        if (isNaN(parsed.getTime())) {
            return {
                text: "تحديث غير معروف",
                timeLabel: String(latestIso),
                cssClass: "sync-warn",
                isStale: false
            };
        }

        const y = parsed.getFullYear();
        const m = String(parsed.getMonth() + 1).padStart(2, '0');
        const d = String(parsed.getDate()).padStart(2, '0');
        const t = parsed.toTimeString().substring(0, 8);
        const diffMin = (Date.now() - parsed.getTime()) / (1000 * 60);

        if (diffMin <= 45) {
            return { text: "محدّث", timeLabel: `${y}/${m}/${d} - ${t}`, cssClass: "sync-fresh", isStale: false };
        }
        if (diffMin <= 150) {
            return { text: `متأخر ${Math.round(diffMin)} د`, timeLabel: `${y}/${m}/${d} - ${t}`, cssClass: "sync-warn", isStale: false };
        }
        return { text: "متوقف / متأخر", timeLabel: `${y}/${m}/${d} - ${t}`, cssClass: "sync-stale", isStale: true };
    }

    function computeBranchMetrics(store, rows, startDate, endDate) {
        const storeId = String(store.store_id ?? store.id ?? "");
        const storeName = store.store_name || `فرع ${storeId}`;

        const storeRows = rows.filter(r => String(r.store_id) === storeId);
        let latestUpdate = null;

        storeRows.forEach(r => {
            if (r.last_update) {
                if (!latestUpdate || new Date(r.last_update) > new Date(latestUpdate)) {
                    latestUpdate = r.last_update;
                }
            }
        });

        const dailyRecords = {};
        storeRows.forEach(item => {
            if (!item.last_update) return;
            const itemDate = String(item.last_update).split('T')[0];
            if (itemDate >= startDate && itemDate <= endDate) {
                if (!dailyRecords[itemDate]) {
                    dailyRecords[itemDate] = item;
                }
            }
        });

        let totalCash = 0;
        let sumCard = 0;
        let sumMobi = 0;
        let sumYesser = 0;
        let sumEdfaq = 0;
        let sumMultiGeneralRaw = 0;
        let sumMultiSpecial = 0;
        let sumNetProfit = 0;

        Object.values(dailyRecords).forEach(item => {
            totalCash += Number(item.cash_sales || 0);
            sumCard += Number(item.card_sales || 0) - Number(item.card_returns || 0);
            sumMobi += Number(item.mobicash_sales || 0) - Number(item.mobicash_returns || 0);
            sumYesser += Number(item.yesserpay_sales || 0) - Number(item.yesserpay_returns || 0);
            sumEdfaq += Number(item.edfaqli_sales || 0) - Number(item.edfaqli_returns || 0);
            sumMultiGeneralRaw += Number(item.multi_cash_sales || 0) - Number(item.multi_cash_returns || 0);
            sumMultiSpecial += Number(item.multi_cash_special_sales || 0);
            sumNetProfit += Number(item.net_profit || 0);
        });

        let netMultiGeneral = sumMultiGeneralRaw - sumMultiSpecial;
        if (netMultiGeneral < 0) netMultiGeneral = 0;

        const cashTotal = totalCash + sumMultiSpecial;
        const bankTotal = sumCard + sumMobi + sumYesser + sumEdfaq + netMultiGeneral;
        const grandTotal = cashTotal + bankTotal;
        const daysCount = Object.keys(dailyRecords).length;
        const syncInfo = getSyncInfo(latestUpdate);

        return {
            storeId,
            storeName,
            grandTotal,
            cashTotal,
            totalCash,
            sumMultiSpecial,
            bankTotal,
            netMultiGeneral,
            sumNetProfit,
            daysCount,
            syncInfo
        };
    }

    function renderBranches() {
        const mode = document.getElementById('filterMode').value;
        const grid = document.getElementById('branchesGrid');

        const filtered = branchesComputedList.filter(b => {
            if (mode === 'active') return b.grandTotal > 0;
            if (mode === 'stale') return b.syncInfo.isStale;
            return true;
        });

        let sumAllTotal = 0;
        let sumAllCash = 0;
        let sumAllBank = 0;

        filtered.forEach(b => {
            sumAllTotal += b.grandTotal;
            sumAllCash += b.cashTotal;
            sumAllBank += b.bankTotal;
        });

        document.getElementById('allBranchesTotal').innerText = formatMoney(sumAllTotal);
        document.getElementById('allBranchesCash').innerText = formatMoney(sumAllCash);
        document.getElementById('allBranchesBank').innerText = formatMoney(sumAllBank);
        document.getElementById('allBranchesCount').innerText = String(filtered.length);

        if (!filtered.length) {
            grid.innerHTML = `<div class="empty-state">لا توجد فروع مطابقة للفلتر أو الفترة المحددة.</div>`;
            return;
        }

        grid.innerHTML = filtered.map(b => `
            <div class="branch-card">
                <div class="branch-head">
                    <div>
                        <h3 class="branch-name">🏪 ${b.storeName}</h3>
                        <div class="branch-id">معرّف الفرع: ${b.storeId} • أيام الحركة: ${b.daysCount}</div>
                    </div>
                    <span class="sync-pill ${b.syncInfo.cssClass}">${b.syncInfo.text}</span>
                </div>

                <div class="total-highlight">
                    <span>إجمالي مبيعات الفرع</span>
                    <strong>${formatMoney(b.grandTotal)}</strong>
                </div>

                <div class="movement-grid">
                    <div class="move-cell">
                        <span class="m-title">💵 إجمالي النقدية</span>
                        <span class="m-val c-cash">${formatMoney(b.cashTotal)}</span>
                    </div>
                    <div class="move-cell">
                        <span class="m-title">💳 الخدمات المصرفية</span>
                        <span class="m-val c-bank">${formatMoney(b.bankTotal)}</span>
                    </div>
                    <div class="move-cell">
                        <span class="m-title">🔀 كاش دفع متعدد</span>
                        <span class="m-val c-multi">${formatMoney(b.sumMultiSpecial)}</span>
                    </div>
                    <div class="move-cell">
                        <span class="m-title">📈 صافي الربح</span>
                        <span class="m-val c-profit">${formatMoney(b.sumNetProfit)}</span>
                    </div>
                </div>

                <div class="branch-footer">
                    <span>مبيعات نقدية مباشرة: ${formatMoney(b.totalCash)}</span>
                    <span>آخر تحديث: ${b.syncInfo.timeLabel}</span>
                </div>
            </div>
        `).join('');
    }

    async function loadAllBranches() {
        const startDate = document.getElementById('startDate').value;
        const endDate = document.getElementById('endDate').value;

        showBanner('loading', '⏳ جاري جلب بيانات جميع الفروع وحركتها...');

        const headers = {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json'
        };

        try {
            const [storesRes, salesRes] = await Promise.all([
                fetch(`${SUPABASE_URL}/rest/v1/stores?select=*&order=store_id.asc`, { headers }),
                fetch(`${SUPABASE_URL}/rest/v1/store_sales?select=*&order=last_update.desc&limit=5000`, { headers })
            ]);

            if (!storesRes.ok || !salesRes.ok) {
                throw new Error("تعذر جلب البيانات من Supabase (تحقق من الاتصال أو صلاحيات القراءة RLS).");
            }

            const stores = await storesRes.json();
            const sales = await salesRes.json();

            branchesComputedList = (stores || []).map(store =>
                computeBranchMetrics(store, sales || [], startDate, endDate)
            );

            showBanner(null, '');
            renderBranches();
        } catch (err) {
            showBanner('error', '❌ ' + err.message);
        }
    }

    const initialToday = formatLocalDate(new Date());
    document.getElementById('startDate').value = initialToday;
    document.getElementById('endDate').value = initialToday;
    loadAllBranches();
</script>
</body>
</html>
