<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم العليا - متابعة المتاجر والمزامنة</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --container-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --card-bg: #0f172a;
        }
        body { font-family: Tahoma, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: var(--container-bg); padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        h2 { text-align: center; color: #38bdf8; margin-top: 0; margin-bottom: 25px; }
        
        .stores-grid { display: flex; flex-direction: column; gap: 15px; }
        .store-card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; }
        .store-info h3 { margin: 0 0 8px 0; color: #38bdf8; font-size: 18px; }
        .store-info p { margin: 0; font-size: 13px; color: var(--text-muted); }
        
        .status-badge { padding: 8px 14px; border-radius: 20px; font-weight: bold; font-size: 13px; text-align: center; }
        .status-good { background: rgba(34, 197, 94, 0.15); color: #22c55e; border: 1px solid #22c55e; }
        .status-bad { background: rgba(248, 113, 113, 0.15); color: #f87171; border: 1px solid #f87171; }
        
        .loading { text-align: center; color: var(--text-muted); padding: 30px; font-size: 16px; }
        .refresh-btn { display: block; width: 100%; margin-top: 20px; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; }
        .refresh-btn:hover { background: #0369a1; }
    </style>
</head>
<body>

<div class="container">
    <h2>⚡ مراقبة حالة المزامنة للمتاجر</h2>
    
    <div id="loadingDiv" class="loading">⏳ جاري فحص حالة اتصال ومزامنة المتاجر...</div>
    <div class="stores-grid" id="storesContainer"></div>

    <button class="refresh-btn" onclick="checkStoresSyncStatus()">تحديث الحالة 🔄</button>
</div>

<script>
    const SUPABASE_URL = "https://romlgjbchyrwlwpcgffi.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJvbWxnamJjaHlyd2x3cGNnZmZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2MDMxNDUsImV4cCI6MjEwMjE3OTE0NX0.wg90ZMVaVMV1UAriGXNEhYqnWlCDzqFjZY87UqSTxbw";

    async function checkStoresSyncStatus() {
        const container = document.getElementById('storesContainer');
        const loadingDiv = document.getElementById('loadingDiv');
        
        loadingDiv.style.display = 'block';
        container.innerHTML = '';

        try {
            // 1. جلب قائمة المتاجر المسجلة
            const storesRes = await fetch(`${SUPABASE_URL}/rest/v1/stores?select=*`, {
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
            });
            const stores = await storesRes.json();

            if (!stores || stores.length === 0) {
                loadingDiv.innerText = "❌ لا توجد متاجر مسجلة في النظام.";
                return;
            }

            let html = '';
            const now = new Date();

            for (let store of stores) {
                const storeId = store.store_id || store.id;
                const storeName = store.store_name || "معرض بدون اسم";

                // 2. جلب آخر عملية تحديث/مزامنة تمت للمتجر من جدول المبيعات
                const salesRes = await fetch(`${SUPABASE_URL}/rest/v1/store_sales?store_id=eq.${storeId}&order=last_update.desc&limit=1&select=last_update`, {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });
                const salesData = await salesRes.json();

                let lastSyncStr = "لم تتم المزامنة بعد";
                let isGood = false;

                if (salesData && salesData.length > 0 && salesData[0].last_update) {
                    const syncDate = new Date(salesData[0].last_update);
                    const diffHours = (now - syncDate) / (1000 * 60 * 60); // الفارق بالساعات

                    // تنسيق الوقت للعرض بشكل جميل
                    const datePart = salesData[0].last_update.split('T')[0];
                    const timePart = salesData[0].last_update.split('T')[1].substring(0, 8);
                    lastSyncStr = `${datePart} ${timePart}`;

                    // إذا كانت المزامنة قد حدثت خلال آخر 3 ساعات، تعتبر ممتازة
                    if (diffHours <= 3) {
                        isGood = true;
                    }
                }

                html += `
                    <div class="store-card">
                        <div class="store-info">
                            <h3>🏪 ${storeName} (رقم المعرض: ${storeId})</h3>
                            <p>آخر وقت مزامنة مسجل: <b>${lastSyncStr}</b></p>
                        </div>
                        <div>
                            ${isGood ? '<span class="status-badge status-good">✅ تعمل بشكل جيد</span>' : '<span class="status-badge status-bad">⚠️ متوقفة أو متأخرة</span>'}
                        </div>
                    </div>
                `;
            }

            loadingDiv.style.display = 'none';
            container.innerHTML = html;

        } catch (err) {
            loadingDiv.style.display = 'block';
            loadingDiv.innerText = "❌ حدث خطأ أثناء جلب بيانات المتاجر: " + err.message;
        }
    }

    // تشغيل الفحص تلقائياً عند فتح الصفحة
    window.onload = checkStoresSyncStatus;
</script>

</body>
</html>
