<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم العليا - متابعة المتاجر والمزامنة</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --container-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --card-bg: #0f172a;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: #f1f5f9;
                --container-bg: #ffffff;
                --text-color: #0f172a;
                --text-muted: #64748b;
                --border-color: #cbd5e1;
                --card-bg: #f8fafc;
            }
        }

        body { font-family: Tahoma, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 15px; transition: 0.3s; }
        .container { max-width: 650px; margin: auto; background: var(--container-bg); padding: 20px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
        h2 { text-align: center; color: #38bdf8; margin-top: 0; margin-bottom: 20px; font-size: 20px; }
        
        .stores-grid { display: flex; flex-direction: column; gap: 12px; }
        .store-card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 15px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .store-info h3 { margin: 0 0 5px 0; color: #38bdf8; font-size: 16px; }
        .store-info p { margin: 0; font-size: 12px; color: var(--text-muted); }
        
        .status-badge { padding: 6px 12px; border-radius: 16px; font-weight: bold; font-size: 12px; text-align: center; white-space: nowrap; }
        
        /* الألوان المطلوبة للحالات */
        .status-good { background: rgba(34, 197, 94, 0.15); color: #22c55e; border: 1px solid #22c55e; }
        .status-warning { background: rgba(234, 179, 8, 0.15); color: #eab308; border: 1px solid #eab308; }
        .status-danger { background: rgba(248, 113, 113, 0.15); color: #f87171; border: 1px solid #f87171; }
        
        .loading { text-align: center; color: var(--text-muted); padding: 20px; font-size: 14px; }
        .refresh-btn { display: block; width: 100%; margin-top: 15px; padding: 10px; background: #0284c7; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .refresh-btn:hover { background: #0369a1; }
    </style>
</head>
<body>

<div class="container">
    <h2>⚡ متابعة المتاجر والمزامنة</h2>
    
    <div id="loadingDiv" class="loading">⏳ جاري فحص حالة اتصال ومزامنة المتاجر...</div>
    <div class="stores-grid" id="storesContainer"></div>

    <button class="refresh-btn" onclick="checkStoresSyncStatus()">تحديث الحالة 🔄</button>
</div>

<script>
    const SUPABASE_URL = "https://romlgjbchyrwlwpcgffi.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJvbWxnamJjaHlyd2x3cGNnZmZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2MDMxNDUsImV4cCI6MjEwMjE3OTE0NX0.wg90ZMVaVMV1UAriGXNEhYqnWlCDzqFjZY87UqSTxbw";

    async function checkStoresSyncStatus() {
        const container = document.getElementById('storesContainer');
        const loadingDiv = document.getElementById('loadingDiv');
        
        loadingDiv.style.display = 'block';
        container.innerHTML = '';

        try {
            // 1. جلب قائمة المتاجر
            const storesRes = await fetch(`${SUPABASE_URL}/rest/v1/stores?select=*`, {
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
            });
            const stores = await storesRes.json();

            if (!stores || stores.length === 0) {
                loadingDiv.innerText = "❌ لا توجد متاجر مسجلة في النظام.";
                return;
            }

            let html = '';
            const now = new Date();

            for (let store of stores) {
                const storeId = store.store_id || store.id;
                const storeName = store.store_name || "معرض بدون اسم";

                // 2. جلب آخر وقت تحديث للمتجر
                const salesRes = await fetch(`${SUPABASE_URL}/rest/v1/store_sales?store_id=eq.${storeId}&order=last_update.desc&limit=1&select=last_update`, {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });
                const salesData = await salesRes.json();

                let lastSyncStr = "لم تتم المزامنة بعد";
                let badgeClass = "status-danger";
                let badgeText = "⚠️ متوقفة (> 24 ساعة)";

                if (salesData && salesData.length > 0 && salesData[0].last_update) {
                    const syncDate = new Date(salesData[0].last_update);
                    const diffHours = (now - syncDate) / (1000 * 60 * 60); // الفارق بالساعات

                    const datePart = salesData[0].last_update.split('T')[0];
                    const timePart = salesData[0].last_update.split('T')[1].substring(0, 8);
                    lastSyncStr = `${datePart} ${timePart}`;

                    // تحديد الحالة بناءً على الفارق الزمني المطلوب
                    if (diffHours <= 3) {
                        badgeClass = "status-good";
                        badgeText = "✅ ممتازة";
                    } else if (diffHours > 3 && diffHours <= 24) {
                        badgeClass = "status-warning";
                        badgeText = "⚠️ متوقفة أو متأخرة";
                    } else {
                        badgeClass = "status-danger";
                        badgeText = "❌ متوقفة (> 24 ساعة)";
                    }
                }

                html += `
                    <div class="store-card">
                        <div class="store-info">
                            <h3>🏪 ${storeName}</h3>
                            <p>آخر مزامنة: <b>${lastSyncStr}</b></p>
                        </div>
                        <div>
                            <span class="status-badge ${badgeClass}">${badgeText}</span>
                        </div>
                    </div>
                `;
            }

            loadingDiv.style.display = 'none';
            container.innerHTML = html;

        } catch (err) {
            loadingDiv.style.display = 'block';
            loadingDiv.innerText = "❌ حدث خطأ أثناء جلب البيانات: " + err.message;
        }
    }

    window.onload = checkStoresSyncStatus;
</script>

</body>
</html>
