<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة عرض المبيعات - معرض سنتر العائلة</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --container-bg: #131b2e;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: #0b0f19;
            --border-color: #1e293b;
            --card-bg: #131b2e;
            --accent-glow: rgba(56, 189, 248, 0.1);
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: #f8fafc;
                --container-bg: #ffffff;
                --text-color: #0f172a;
                --text-muted: #64748b;
                --input-bg: #f1f5f9;
                --border-color: #e2e8f0;
                --card-bg: #f8fafc;
                --accent-glow: rgba(2, 132, 199, 0.08);
            }
        }

        body { 
            font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            margin: 0; 
            padding: 12px; 
            transition: background-color 0.3s ease; 
        }
        
        .container { 
            max-width: 600px; 
            margin: auto; 
            background: var(--container-bg); 
            padding: 20px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2), 0 8px 10px -6px rgba(0, 0, 0, 0.2); 
            border: 1px solid var(--border-color);
        }

        h2 { 
            text-align: center; 
            color: #38bdf8; 
            margin-top: 0; 
            margin-bottom: 6px; 
            font-size: 22px; 
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .store-tag { 
            text-align: center; 
            color: #fb923c; 
            font-size: 15px; 
            font-weight: 700; 
            margin-bottom: 4px; 
        }

        .last-sync-time { 
            text-align: center; 
            color: var(--text-muted); 
            font-size: 12px; 
            margin-bottom: 16px; 
            font-weight: 500;
        }
        
        #loginSection { text-align: center; padding: 20px 0; }
        label { font-weight: 600; font-size: 13px; color: var(--text-muted); }
        
        input[type="text"], input[type="password"], input[type="date"] { 
            width: 100%; 
            padding: 12px; 
            font-size: 14px; 
            border-radius: 10px; 
            border: 1px solid var(--border-color); 
            background: var(--input-bg); 
            color: var(--text-color); 
            box-sizing: border-box; 
            margin-bottom: 14px; 
            text-align: center; 
            transition: all 0.2s ease;
        }
        
        input[type="text"]:focus, input[type="password"]:focus, input[type="date"]:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        
        .btn { 
            width: 100%; 
            padding: 12px; 
            font-size: 15px; 
            font-weight: 700; 
            border-radius: 10px; 
            border: none; 
            cursor: pointer; 
            transition: all 0.2s ease; 
        }
        
        .btn-primary { 
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); 
            color: white; 
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
        }
        
        .btn-primary:hover { 
            background: linear-gradient(135deg, #0369a1 100%, #075985 100%); 
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(2, 132, 199, 0.35);
        }
        
        .date-range-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .date-group { text-align: right; }
        .date-group label { font-size: 12px; display: block; margin-bottom: 4px; }
        .date-group input { margin-bottom: 0; padding: 10px; font-size: 13px; }

        .stats-container { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
        
        .stat-card { 
            background: var(--card-bg); 
            border: 1px solid var(--border-color); 
            padding: 16px; 
            border-radius: 12px; 
            text-align: center; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: all 0.25s ease;
        }
        
        .stat-card.cash { border-right: 6px solid #22c55e; }
        
        .stat-card.bank { 
            border-right: 6px solid #3b82f6; 
            cursor: pointer; 
        }
        .stat-card.bank:hover { 
            transform: translateY(-2px); 
            background-color: rgba(59, 130, 246, 0.04);
            border-color: rgba(59, 130, 246, 0.3);
        }
        
        .stat-card.total { 
            border-right: 6px solid #eab308; 
            background: linear-gradient(to left, rgba(234, 179, 8, 0.03), var(--card-bg)); 
        }
        
        .stat-title { font-size: 13px; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; }
        .stat-value { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
        
        .val-cash { color: #22c55e; }
        .val-bank { color: #3b82f6; }
        .val-total { color: #eab308; }
        
        .hint-text { display: block; font-size: 11px; margin-top: 4px; font-weight: 700; opacity: 0.9; }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(4px);
        }
        .modal-content {
            background-color: var(--container-bg);
            margin: 15% auto;
            padding: 20px;
            border-radius: 14px;
            width: 85%;
            max-width: 380px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            text-align: right;
            max-height: 70vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 12px;
        }
        .modal-header h3 { color: #38bdf8; margin: 0; font-size: 16px; font-weight: 700; }
        .close-btn { background: none; border: none; font-size: 24px; color: var(--text-muted); cursor: pointer; transition: color 0.2s; }
        .close-btn:hover { color: var(--text-color); }
        
        .bank-details-list { list-style: none; padding: 0; margin: 0; }
        .bank-details-list li {
            display: flex;
            justify-content: space-between;
            padding: 11px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
            font-weight: 500;
        }
        .bank-details-list li:last-child { border-bottom: none; }

        .search-section { margin-top: 22px; border-top: 2px solid var(--border-color); padding-top: 18px; }
        
        .search-mode-selector { 
            display: flex; justify-content: center; gap: 20px; margin-bottom: 12px; background: var(--input-bg); padding: 10px; border-radius: 10px; border: 1px solid var(--border-color); 
        }
        .search-mode-selector label { font-size: 13px; cursor: pointer; font-weight: 700; display: flex; align-items: center; gap: 6px; color: var(--text-color); }

        .search-box-wrapper { display: flex; gap: 8px; margin-bottom: 12px; }
        .search-box-wrapper input { margin-bottom: 0; text-align: center; flex: 1; font-weight: 700; padding: 12px; font-size: 14px; }
        
        .btn-action { background: #0284c7; color: white; border: none; padding: 0 14px; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 13px; white-space: nowrap; transition: background 0.2s; }
        .btn-action:hover { background: #0369a1; }

        .btn-scan { background: #059669; color: white; border: none; padding: 0 14px; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 13px; white-space: nowrap; transition: background 0.2s; }
        .btn-scan:hover { background: #047857; }

        #reader { width: 100%; max-width: 350px; margin: 0 auto 12px auto; border-radius: 12px; overflow: hidden; display: none; border: 2px solid #38bdf8; }

        .items-results { display: flex; flex-direction: column; gap: 10px; max-height: 350px; overflow-y: auto; }
        
        .item-card { 
            background: var(--card-bg); 
            border: 1px solid var(--border-color); 
            padding: 14px; 
            border-radius: 10px; 
            display: flex; 
            flex-direction: column;
