<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الإدارة - مبيعات المعارض</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 15px; }
        .container { max-width: 650px; margin: auto; background: #1e293b; padding: 20px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h2 { text-align: center; color: #38bdf8; margin-top: 0; }
        .store-tag { text-align: center; color: #e67e22; font-size: 16px; font-weight: bold; margin-bottom: 20px; }
        
        #loginSection { text-align: center; padding: 20px 0; }
        input { width: 100%; padding: 12px; font-size: 16px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; margin-bottom: 15px; text-align: center; }
        
        .btn { width: 100%; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: #0284c7; color: white; }
        .btn-primary:hover { background: #0369a1; }
        
        /* تنسيق اختيار الفترة */
        .date-range-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .date-group { text-align: right; }
        .date-group label { font-size: 13px; color: #94a3b8; display: block; margin-bottom: 4px; }
        .date-group input { margin-bottom: 0; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        .stat-card { background: #0f172a; border: 1px solid #334155; padding: 15px; border-radius: 12px; text-align: center; }
        .stat-card.cash { border-top: 4px solid #22c55e; }
        .stat-card.bank { border-top: 4px solid #3b82f6; }
        .stat-card.total { grid-column: span 2; border-top: 4px solid #eab308; background: #1e293b; }
        
        .stat-title { font-size: 14px; color: #94a3b8; margin-bottom: 5px; }
        .stat-value { font-size: 22px; font-weight: bold; }
        .val-cash { color: #4ade80; }
        .val-bank { color: #60a5fa; }
        .val-total { color: #fde047; }
        
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 لوحة تحكم الإدارة</h2>
    <div class="store-tag" id="welcomeStore">تسجيل الدخول مطلوب</div>

    <!-- شاشة تسجيل الدخول -->
    <div id="loginSection">
        <label style="display:block; margin-bottom: 8px; color: #cbd5e1; text-align: right;">اسم المستخدم:</label>
        <input type="text" id="userInput" placeholder="أدخل اسم المستخدم...">
        
        <label style="display:block; margin-bottom: 8px; color: #cbd5e1; text-align: right;">كلمة المرور:</label>
        <input type="password" id="passInput" placeholder="****">

        <button class="btn btn-primary" onclick="cloudLogin()">دخول 🔐</button>
        <p id="loginError" style="color: #f87171; display: none; margin-top: 10px;">❌ اسم المستخدم أو كلمة المرور غير صحيحة</p>
        <p id="loginLoading" style="color: #38bdf8; display: none; margin-top: 10px;">⏳ جاري التحقق من قاعدة البيانات...</p>
    </div>

    <!-- لوحة البيانات الرئيسية -->
    <div id="dashboardSection" class="hidden">
        <!-- تحديد الفترة الزمنية من / إلى -->
        <div class="date-range-grid">
            <div class="date-group">
                <label>من تاريخ:</label>
                <input type="date" id="startDate">
            </div>
            <div class="date-group">
                <label>إلى تاريخ:</label>
                <input type="date" id="endDate">
            </div>
        </div>
        <button class="btn btn-primary" style="margin-bottom: 15px;" onclick="fetchSalesData()">عرض التقرير 🔍</button>

        <div id="loadingStatus" style="text-align: center; color: #94a3b8; display: none;">⏳ جاري جلب البيانات من السحابة...</div>

        <div class="stats-grid" id="statsGrid">
            <div class="stat-card cash">
                <div class="stat-title">💵 المبيعات النقدية (كاش الصافي)</div>
                <div class="stat-value val-cash" id="cashAmount">0.00 د.ل</div>
            </div>
            <div class="stat-card bank">
                <div class="stat-title">💳 المبيعات المصرفية والبطاقات</div>
                <div class="stat-value val-bank" id="bankAmount">0.00 د.ل</div>
            </div>
            <div class="stat-card total">
                <div class="stat-title">💰 إجمالي صافي المبيعات للفترة</div>
                <div class="stat-value val-total" id="totalAmount">0.00 د.ل</div>
            </div>
        </div>
        
        <button class="btn" style="background: #475569; color: white; margin-top: 20px;" onclick="location.reload()">تسجيل الخروج 🚪</button>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://romlgjbchyrwlwpcgffi.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJvbWxnamJjaHlyd2x3cGNnZmZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2MDMxNDUsImV4cCI6MjEwMjE3OTE0NX0.wg90ZMVaVMV1UAriGXNEhYqnWlCDzqFjZY87UqSTxbw";
    
    let currentStoreId = null;

    // ضبط التواريخ الافتراضية إلى تاريخ اليوم
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('startDate').value = today;
    document.getElementById('endDate').value = today;

    async function cloudLogin() {
        const usernameInput = document.getElementById('userInput').value.trim();
        const passwordInput = document.getElementById('passInput').value.trim();
        const errorMsg = document.getElementById('loginError');
        const loadingMsg = document.getElementById('loginLoading');

        if (!usernameInput || !passwordInput) {
            errorMsg.innerText = "⚠️ الرجاء إدخال اسم المستخدم وكلمة المرور";
            errorMsg.style.display = 'block';
            return;
        }

        errorMsg.style.display = 'none';
        loadingMsg.style.display = 'block';

        try {
            const response = await fetch(`${SUPABASE_URL}/rest/v1/stores?username=eq.${encodeURIComponent(usernameInput)}&password=eq.${encodeURIComponent(passwordInput)}&select=*`, {
                method: 'GET',
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${SUPABASE_KEY}`,
                    'Content-Type': 'application/json'
                }
            });

            loadingMsg.style.display = 'none';

            if (!response.ok) {
                errorMsg.innerText = "❌ خطأ في الاتصال بقاعدة البيانات";
                errorMsg.style.display = 'block';
                return;
            }

            const data = await response.json();

            if (data && data.length > 0) {
                const store = data[0];
                currentStoreId = String(store.store_id || store.id || "2");
                
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('dashboardSection').classList.remove('hidden');
                document.getElementById('welcomeStore').innerText = `🏪 ${store.store_name || 'معرض التجارة'}`;
                
                fetchSalesData();
            } else {
                errorMsg.innerText = "❌ اسم المستخدم أو كلمة المرور غير صحيحة";
                errorMsg.style.display = 'block';
            }
        } catch (err) {
            loadingMsg.style.display = 'none';
            errorMsg.innerText = "❌ خطأ في النظام: " + err.message;
            errorMsg.style.display = 'block';
        }
    }

    async function fetchSalesData() {
        if (!currentStoreId) return;

        const startDate = document.getElementById('startDate').value;
        const endDate = document.getElementById('endDate').value;
        const loadingDiv = document.getElementById('loadingStatus');
        
        loadingDiv.style.display = 'block';

        try {
            // جلب السجلات التابعة لـ store_id المحدد
            const response = await fetch(`${SUPABASE_URL}/rest/v1/store_sales?store_id=eq.${currentStoreId}&select=*`, {
                method: 'GET',
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${SUPABASE_KEY}`,
                    'Content-Type': 'application/json'
                }
            });

            loadingDiv.style.display = 'none';

            if (!response.ok) return;

            const data = await response.json();

            let totalCash = 0;
            let totalBank = 0;
            let grandTotal = 0;

            if (data && data.length > 0) {
                // تصفية النتائج جغرافياً حسب نطاق التاريخ المحدد (من / إلى)
                const filtered = data.filter(item => {
                    if (!item.last_update) return false;
                    const itemDate = item.last_update.split('T')[0];
                    return itemDate >= startDate && itemDate <= endDate;
                });

                filtered.forEach(item => {
                    const netCash = Number(item.cash_sales || 0) - Number(item.cash_returns || 0);
                    
                    const netCard = Number(item.card_sales || 0) - Number(item.card_returns || 0);
                    const netMobi = Number(item.mobicash_sales || 0) - Number(item.mobicash_returns || 0);
                    const netYesser = Number(item.yesserpay_sales || 0) - Number(item.yesserpay_returns || 0);
                    const netEdfaq = Number(item.edfaqli_sales || 0) - Number(item.edfaqli_returns || 0);

                    const netBankTotal = netCard + netMobi + netYesser + netEdfaq;

                    totalCash += netCash;
                    totalBank += netBankTotal;
                    grandTotal += Number(item.total_sales || 0);
                });
            }

            document.getElementById('cashAmount').innerText = totalCash.toFixed(2) + " د.ل";
            document.getElementById('bankAmount').innerText = totalBank.toFixed(2) + " د.ل";
            document.getElementById('totalAmount').innerText = grandTotal.toFixed(2) + " د.ل";

        } catch (err) {
            loadingDiv.style.display = 'none';
            console.error("خطأ في جلب المبيعات:", err);
        }
    }
</script>

</body>
</html>
